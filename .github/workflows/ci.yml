name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Nox
        run: |
          uv sync --group dev --group lint --group deps --group typecheck --group test
          uv run --group dev nox -s lint deps typecheck test package

  lint-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - services/ads/Containerfile
          - services/ads-egress-controlplane/Containerfile
          - services/ads-engine/Containerfile
          - services/ads-preferences/Containerfile
          - services/ads-sandbox-mcp/Containerfile
          - services/ads-sandbox-ipc/Containerfile
          - services/ads-sandbox-manager/Containerfile
          - services/ads-sandbox-golden/Containerfile
          - services/ads-sandbox-golden/Containerfile.inner
          - services/ads-sandbox-base/Containerfile
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: warning

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: lint-image
    strategy:
      matrix:
        include:
          - image: ads
            file: services/ads/Containerfile
            context: .
            smoke: "import ads; print(ads.__version__)"
            pack: "false"
          - image: ads-egress-controlplane
            file: services/ads-egress-controlplane/Containerfile
            context: .
            smoke: "import ads_egress_controlplane; print(ads_egress_controlplane.__version__)"
            pack: "false"
          - image: ads-engine
            file: services/ads-engine/Containerfile
            context: .
            smoke: "import ads_engine; print(ads_engine.__version__)"
            pack: "false"
          - image: ads-preferences
            file: services/ads-preferences/Containerfile
            context: .
            smoke: "import ads_preferences; print(ads_preferences.__version__)"
            pack: "false"
          - image: ads-sandbox-golden
            file: services/ads-sandbox-golden/Containerfile
            context: services/ads-sandbox-golden
            smoke: ""
            pack: "true"
          - image: ads-sandbox-mcp
            file: services/ads-sandbox-mcp/Containerfile
            context: .
            smoke: "import ads_sandbox_mcp; print(ads_sandbox_mcp.__version__)"
            pack: "false"
          - image: ads-sandbox-base
            file: services/ads-sandbox-base/Containerfile
            context: services/ads-sandbox-base
            smoke: ""
            pack: "false"
          - image: ads-sandbox-ipc
            file: services/ads-sandbox-ipc/Containerfile
            context: .
            smoke: "import ads_sandbox_ipc; print(ads_sandbox_ipc.__version__)"
            pack: "false"
          - image: ads-sandbox-manager
            file: services/ads-sandbox-manager/Containerfile
            context: .
            smoke: "import ads_sandbox_manager; print(ads_sandbox_manager.__version__)"
            pack: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Install zstd
        if: matrix.pack == 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Pack inner rootfs
        if: matrix.pack == 'true'
        run: |
          set -euo pipefail
          docker buildx build --load --platform linux/amd64 \
            -f services/ads-sandbox-golden/Containerfile.inner \
            -t ads-sandbox-inner:ci \
            services/ads-sandbox-golden
          cid=$(docker create --platform linux/amd64 ads-sandbox-inner:ci /bin/true)
          rm -f services/ads-sandbox-golden/rootfs.tar.zst
          docker export "$cid" | python3 services/ads-sandbox-golden/scripts/pack-rootfs | zstd -T0 -19 -o services/ads-sandbox-golden/rootfs.tar.zst
          docker rm "$cid" >/dev/null
          docker rmi ads-sandbox-inner:ci >/dev/null || true
          bytes=$(stat -c '%s' services/ads-sandbox-golden/rootfs.tar.zst)
          echo "rootfs.tar.zst ${bytes} bytes"
          if [ "$bytes" -lt 1024 ]; then
            echo "compressed rootfs too small" >&2
            exit 1
          fi
          if [ "$bytes" -ge 1073741824 ]; then
            echo "compressed rootfs exceeds 1Gi (sparse disk in image?)" >&2
            exit 1
          fi
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Guard golden image size
        if: matrix.pack == 'true'
        run: |
          set -euo pipefail
          size=$(docker image inspect -f '{{.Size}}' ${{ matrix.image }}:ci)
          echo "image ${size} bytes"
          if [ "$size" -ge 2147483648 ]; then
            echo "image exceeds 2Gi (sparse disk in image?)" >&2
            exit 1
          fi
      - name: Smoke image
        if: matrix.smoke != ''
        run: docker run --rm ${{ matrix.image }}:ci python -c "${{ matrix.smoke }}"
      - name: Smoke golden entrypoint
        if: matrix.pack == 'true'
        run: |
          set +e
          docker run --rm ${{ matrix.image }}:ci
          st=$?
          set -e
          test "$st" -eq 1
      - name: Smoke guest entrypoint
        if: matrix.image == 'ads-sandbox-base'
        run: |
          set +e
          docker run --rm ${{ matrix.image }}:ci
          st=$?
          set -e
          test "$st" -eq 1

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and template
        run: |
          helm lint charts/ads
          helm template ads charts/ads >/tmp/ads-cm.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/ads-cm.yaml)" -eq 4
          test "$(grep -c '^kind: HTTPRoute$' /tmp/ads-cm.yaml)" -eq 1
          test "$(grep -c '^kind: Certificate$' /tmp/ads-cm.yaml)" -eq 2
          grep -q 'kind: Certificate' /tmp/ads-cm.yaml
          grep -q 'kind: HTTPRoute' /tmp/ads-cm.yaml
          grep -q 'kind: BackendTLSPolicy' /tmp/ads-cm.yaml
          grep -q 'X-Forwarded-Proto' /tmp/ads-cm.yaml
          if grep -q 'kind: Ingress$' /tmp/ads-cm.yaml; then
            echo 'Ingress must not be rendered' >&2
            exit 1
          fi
          grep -q 'ADS_TLS_CERT_PATH' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-egress-controlplane' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-engine' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-preferences' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_BASE_URL: "https://ads-preferences:8080"' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_KEYCLOAK_AUDIENCE: "ads-preferences"' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_TLS_CERT_PATH' /tmp/ads-cm.yaml
          if grep -qE 'kind: PersistentVolume(Claim)?$' /tmp/ads-cm.yaml; then
            echo 'PV/PVC must not be rendered' >&2
            exit 1
          fi
          if grep -q 'ADS_DATA_DIR' /tmp/ads-cm.yaml; then
            echo 'ADS_DATA_DIR must not be rendered' >&2
            exit 1
          fi
          if awk '/^kind: HTTPRoute$/{p=1} p && /^kind: / && !/^kind: HTTPRoute$/{p=0} p && /ads-preferences/{found=1} END{exit found?0:1}' /tmp/ads-cm.yaml; then
            echo 'ads-preferences must not have HTTPRoute' >&2
            exit 1
          fi
          grep -q 'ADS_ENGINE_KEYCLOAK_WELL_KNOWN_URL: "https://keycloak.interlab/realms/ads/.well-known/openid-configuration"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_ISSUER: "https://keycloak.interlab/realms/ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_AUDIENCE: "ads-engine"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_CLIENT_ID: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"' /tmp/ads-cm.yaml
          grep -q 'ads.io/application-node: "true"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_WELL_KNOWN_URL: "https://keycloak.interlab/realms/ads/.well-known/openid-configuration"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_ISSUER: "https://keycloak.interlab/realms/ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_CLIENT_ID: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_AUDIENCE: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_ROLE: "user"' /tmp/ads-cm.yaml
          if grep -qE 'kind: Keycloak(RealmImport)?$|k8s\.keycloak\.org' /tmp/ads-cm.yaml; then
            echo 'Keycloak CRDs must not be rendered' >&2
            exit 1
          fi
          if grep -q 'ADS_TLS_ENABLED' /tmp/ads-cm.yaml; then
            echo 'plain HTTP toggle still present' >&2
            exit 1
          fi
          helm template ads charts/ads \
            --set tls.certManager.enabled=false \
            --set tls.serviceSecretName=byo-service \
            --set preferences.tls.serviceSecretName=byo-preferences \
            >/tmp/ads-byo.yaml
          if grep -q 'kind: Certificate' /tmp/ads-byo.yaml; then
            echo 'BYO template still issues Certificates' >&2
            exit 1
          fi
          grep -q 'secretName: byo-service' /tmp/ads-byo.yaml
          grep -q 'secretName: byo-preferences' /tmp/ads-byo.yaml
          grep -q 'kind: HTTPRoute' /tmp/ads-byo.yaml
          if helm template ads charts/ads --set tls.certManager.enabled=false >/tmp/ads-byo-missing.yaml; then
            echo 'BYO without secrets should fail' >&2
            exit 1
          fi
          helm template ads charts/ads \
            --set tls.caBundle.secretName=lab-ca \
            >/tmp/ads-ca.yaml
          grep -q 'ADS_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
          grep -q 'ADS_ENGINE_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
          grep -q 'ADS_PREFERENCES_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
      - name: Namespace and Kyverno prerequisite regressions
        run: python3 -m unittest discover -s charts/ads/tests -v
