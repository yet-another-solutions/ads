name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Nox
        run: |
          uv sync --group dev --group lint --group deps --group typecheck --group test
          uv run --group dev nox -s lint deps typecheck test package

  lint-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Containerfile
          config: .hadolint.yaml
          failure-threshold: warning

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-image
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ads:ci
          cache-from: type=gha,scope=ads
          cache-to: type=gha,mode=max,scope=ads
      - name: Smoke image
        run: docker run --rm ads:ci python -c "import ads; print(ads.__version__)"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and template
        run: |
          helm lint charts/ads
          helm template ads charts/ads >/tmp/ads-cm.yaml
          grep -q 'kind: Deployment' /tmp/ads-cm.yaml
          grep -q 'kind: Certificate' /tmp/ads-cm.yaml
          grep -q 'backend-protocol: "HTTPS"' /tmp/ads-cm.yaml
          grep -q 'ADS_TLS_CERT_PATH' /tmp/ads-cm.yaml
          if grep -q 'ADS_TLS_ENABLED' /tmp/ads-cm.yaml; then
            echo 'plain HTTP toggle still present' >&2
            exit 1
          fi
          helm template ads charts/ads \
            --set tls.certManager.enabled=false \
            --set tls.ingressSecretName=byo-ingress \
            --set tls.serviceSecretName=byo-service \
            >/tmp/ads-byo.yaml
          if grep -q 'kind: Certificate' /tmp/ads-byo.yaml; then
            echo 'BYO template still issues Certificates' >&2
            exit 1
          fi
          grep -q 'secretName: byo-ingress' /tmp/ads-byo.yaml
          grep -q 'secretName: byo-service' /tmp/ads-byo.yaml
          if helm template ads charts/ads --set tls.certManager.enabled=false >/tmp/ads-byo-missing.yaml; then
            echo 'BYO without secrets should fail' >&2
            exit 1
          fi
          helm template ads charts/ads \
            --set tls.caBundle.secretName=lab-ca \
            >/tmp/ads-ca.yaml
          grep -q 'ADS_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
