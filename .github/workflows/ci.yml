name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  UV_DEFAULT_INDEX: https://pypi.org/simple
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Nox
        run: |
          uv sync --group dev --group lint --group deps --group typecheck --group test
          uv run --group dev nox -s lint deps typecheck test package

  lint-image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dockerfile:
          - services/ads/Containerfile
          - services/ads-audit/Containerfile
          - services/ads-egress-controlplane/Containerfile
          - services/ads-engine/Containerfile
          - services/ads-guardrail/Containerfile
          - services/ads-injection-scanner/Containerfile
          - services/ads-mcp-probe/Containerfile
          - services/ads-policy/Containerfile
          - services/ads-preferences/Containerfile
    steps:
      - uses: actions/checkout@v7
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          config: .hadolint.yaml
          failure-threshold: warning

  build-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-image
    strategy:
      matrix:
        include:
          - image: ads
            file: services/ads/Containerfile
            smoke: "import ads; print(ads.__version__)"
          - image: ads-egress-controlplane
            file: services/ads-egress-controlplane/Containerfile
            smoke: "import ads_egress_controlplane; print(ads_egress_controlplane.__version__)"
          - image: ads-engine
            file: services/ads-engine/Containerfile
            smoke: "import ads_engine; print(ads_engine.__version__)"
          - image: ads-policy
            file: services/ads-policy/Containerfile
            smoke: "import ads_policy; print(ads_policy.__version__)"
          - image: ads-audit
            file: services/ads-audit/Containerfile
            smoke: "import ads_audit; print(ads_audit.__version__)"
          - image: ads-preferences
            file: services/ads-preferences/Containerfile
            smoke: "import ads_preferences; print(ads_preferences.__version__)"
          - image: ads-guardrail
            file: services/ads-guardrail/Containerfile
            smoke: "import ads_guardrail; print(ads_guardrail.__version__)"
          - image: ads-mcp-probe
            file: services/ads-mcp-probe/Containerfile
            smoke: "import ads_mcp_probe; print(ads_mcp_probe.__version__)"
          - image: ads-injection-scanner
            file: services/ads-injection-scanner/Containerfile
            smoke: "import ads_injection_scanner.classifier, onnxruntime; print(onnxruntime.__version__)"
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/amd64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke image
        run: docker run --rm ${{ matrix.image }}:ci python -c "${{ matrix.smoke }}"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and template
        run: |
          VALUES="-f charts/ads/values-ci.yaml"
          helm lint charts/ads $VALUES
          helm template ads charts/ads $VALUES >/tmp/ads-cm.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/ads-cm.yaml)" -eq 6
          test "$(grep -c '^kind: HTTPRoute$' /tmp/ads-cm.yaml)" -eq 1
          test "$(grep -c '^kind: Certificate$' /tmp/ads-cm.yaml)" -eq 4
          grep -q 'kind: Certificate' /tmp/ads-cm.yaml
          grep -q 'kind: HTTPRoute' /tmp/ads-cm.yaml
          grep -q 'kind: BackendTLSPolicy' /tmp/ads-cm.yaml
          grep -q 'X-Forwarded-Proto' /tmp/ads-cm.yaml
          if grep -q 'kind: Ingress$' /tmp/ads-cm.yaml; then
            echo 'Ingress must not be rendered' >&2
            exit 1
          fi
          grep -q 'ADS_TLS_CERT_PATH' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-egress-controlplane' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-policy' /tmp/ads-cm.yaml
          grep -q 'ADS_POLICY_URL: "https://ads-policy:8081"' /tmp/ads-cm.yaml
          grep -q 'ADS_POLICY_API_TOKEN' /tmp/ads-cm.yaml
          grep -q 'ADS_POLICY_DIR: "/policy"' /tmp/ads-cm.yaml
          grep -q 'ADS_RUN_TTL_SECONDS: "3600"' /tmp/ads-cm.yaml
          grep -q 'ADS_POLICY_RELOAD_SECONDS: "10"' /tmp/ads-cm.yaml
          if grep -q 'policy.yaml: |' /tmp/ads-cm.yaml; then
            echo 'no policy document was set, so none must be rendered' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES \
            --set-json 'policy.document={"version":"org-2","rules":[]}' >/tmp/ads-doc.yaml
          grep -q 'policy.yaml: |' /tmp/ads-doc.yaml
          grep -q 'ADS_SANDBOX_AVAILABLE' /tmp/ads-cm.yaml
          grep -q 'ADS_REDIS_URL' /tmp/ads-cm.yaml
          if helm template ads charts/ads $VALUES --set=policy.redis.url= >/tmp/ads-no-redis.yaml; then
            echo 'policy service rendered without a run store' >&2
            exit 1
          fi
          grep -q 'app.kubernetes.io/component: ads-audit' /tmp/ads-cm.yaml
          grep -q 'ADS_DATABASE_URL' /tmp/ads-cm.yaml
          test "$(grep -c 'ADS_DATABASE_URL' /tmp/ads-cm.yaml)" -eq 2
          grep -q 'ADS_PUBLIC_BASE_URL: "https://ads.interlab"' /tmp/ads-cm.yaml
          helm template ads charts/ads $VALUES --set=httpRoute.publicBaseUrl=https://ads.local:8443/ \
            | grep -q 'ADS_PUBLIC_BASE_URL: "https://ads.local:8443"'
          test "$(grep -c 'ADS_AMQP_URL' /tmp/ads-cm.yaml)" -eq 3
          grep -q 'ADS_KEYCLOAK_AUDITOR_ROLE: "auditor"' /tmp/ads-cm.yaml
          if helm template ads charts/ads $VALUES --set=audit.rabbitmq.url= >/tmp/ads-no-mq.yaml; then
            echo 'decisions rendered with nowhere to be journalled' >&2
            exit 1
          fi
          if helm template ads charts/ads $VALUES --set=audit.postgres.url= >/tmp/ads-no-pg.yaml; then
            echo 'audit rendered without a journal' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set-json 'guardrail.mcpServers=[{"name":"sandbox","url":"http://sandbox:8080/mcp","site":{"runtimeClassName":"kata-clh","nodeLabels":{"ads.io/sandbox-node":"true"}}}]' \
            >/tmp/ads-guard.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/ads-guard.yaml)" -eq 7
          grep -q 'app.kubernetes.io/component: ads-guardrail' /tmp/ads-guard.yaml
          grep -q 'ADS_GUARDRAIL_API_TOKEN' /tmp/ads-guard.yaml
          grep -q '\\"name\\":\\"sandbox\\"' /tmp/ads-guard.yaml
          grep -q '\\"runtime_class_name\\":\\"kata-clh\\"' /tmp/ads-guard.yaml
          if grep -qE 'ADS_PLACEMENT|ADS_SUBJECT' /tmp/ads-guard.yaml; then
            echo 'the shared service must not describe a sandbox or a person it does not serve' >&2
            exit 1
          fi
          grep -q 'ADS_APPLICATIONS: "\[\]"' /tmp/ads-guard.yaml
          grep -q 'ADS_MCP_AUDIENCE: ""' /tmp/ads-guard.yaml
          grep -q 'ADS_KEYCLOAK_ISSUER: "https://keycloak.interlab/realms/ads"' /tmp/ads-guard.yaml
          if helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set-json 'guardrail.mcpServers=[{"name":"sandbox","url":"http://sandbox:8080/mcp"}]' >/tmp/ads-guard-bad.yaml; then
            echo 'an MCP server rendered without saying where its tools execute' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set-json 'guardrail.applications=[{"name":"hermes","keySha256":"'"$(printf 'a%.0s' $(seq 64))"'","workspace":{"project":"ads","repo":"r","env":"test"}}]' \
            >/tmp/ads-apps.yaml
          grep -q '\\"name\\":\\"hermes\\"' /tmp/ads-apps.yaml
          if helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set-json 'guardrail.applications=[{"name":"hermes","keySha256":"x"}]' >/tmp/ads-apps-bad.yaml; then
            echo 'an application rendered without a workspace' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set injectionScanner.enabled=true --set mcpProbe.enabled=true \
            --set engine.tools.enabled=true --set tls.caBundle.secretName=lab-ca \
            --set engine.tools.workspace.project=ads --set engine.tools.workspace.repo=r \
            --set engine.tools.workspace.env=test >/tmp/ads-chain.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/ads-chain.yaml)" -eq 10
          test "$(grep -c '^kind: Certificate$' /tmp/ads-chain.yaml)" -eq 8
          grep -q 'app.kubernetes.io/component: ads-injection-scanner' /tmp/ads-chain.yaml
          grep -q 'ADS_INJECTION_SCANNER_URL: "https://ads-injection-scanner:8085"' /tmp/ads-chain.yaml
          grep -q 'ADS_INJECTION_SCANNER_API_TOKEN' /tmp/ads-chain.yaml
          grep -q 'ADS_SCANNER_API_TOKEN' /tmp/ads-chain.yaml
          grep -q 'runtimeClassName: kata-qemu' /tmp/ads-chain.yaml
          grep -q '\\"name\\":\\"probe-vm\\"' /tmp/ads-chain.yaml
          grep -q '\\"url\\":\\"https://ads-mcp-probe-container:8084/mcp\\"' /tmp/ads-chain.yaml
          grep -q 'ADS_ENGINE_MCP_SERVERS: "probe-vm,probe-container"' /tmp/ads-chain.yaml
          grep -q 'ADS_ENGINE_GUARDRAIL_URL: "https://ads-guardrail:8083"' /tmp/ads-chain.yaml
          grep -q 'ADS_ENGINE_GUARDRAIL_API_TOKEN' /tmp/ads-chain.yaml
          if helm template ads charts/ads $VALUES --set=engine.tools.enabled=true \
            --set tls.caBundle.secretName=lab-ca >/tmp/ads-tools-no-guardrail.yaml 2>&1; then
            echo 'engine tools rendered without a guardrail to go through' >&2
            exit 1
          fi
          if helm template ads charts/ads $VALUES --set=guardrail.enabled=true \
            --set engine.tools.enabled=true --set-json 'engine.tools.mcpServers=["probe"]' \
            --set engine.tools.workspace.project=ads --set engine.tools.workspace.repo=r \
            --set engine.tools.workspace.env=test >/tmp/ads-tools-no-ca.yaml 2>&1; then
            echo 'engine tools rendered without a CA to trust the guardrail' >&2
            exit 1
          fi
          if helm template ads charts/ads $VALUES --set=mcpProbe.enabled=true \
            --set-json 'mcpProbe.sites=[{"name":"nowhere"}]' >/tmp/ads-probe-nowhere.yaml 2>&1; then
            echo 'a probe rendered without saying where it runs' >&2
            exit 1
          fi
          grep -q 'ADS_EGRESS_ALLOWLIST: "mirror.interlab,llm-gateway.interlab,tool-broker.interlab,git-proxy.interlab"' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-engine' /tmp/ads-cm.yaml
          grep -q 'app.kubernetes.io/component: ads-preferences' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_BASE_URL: "https://ads-preferences:8080"' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_KEYCLOAK_AUDIENCE: "ads-preferences"' /tmp/ads-cm.yaml
          grep -q 'ADS_PREFERENCES_TLS_CERT_PATH' /tmp/ads-cm.yaml
          if grep -qE 'kind: PersistentVolume(Claim)?$' /tmp/ads-cm.yaml; then
            echo 'PV/PVC must not be rendered' >&2
            exit 1
          fi
          if grep -q 'ADS_DATA_DIR' /tmp/ads-cm.yaml; then
            echo 'ADS_DATA_DIR must not be rendered' >&2
            exit 1
          fi
          if awk '/^kind: HTTPRoute$/{p=1} p && /^kind: / && !/^kind: HTTPRoute$/{p=0} p && /ads-preferences/{found=1} END{exit found?0:1}' /tmp/ads-cm.yaml; then
            echo 'ads-preferences must not have HTTPRoute' >&2
            exit 1
          fi
          grep -q 'ADS_ENGINE_KEYCLOAK_WELL_KNOWN_URL: "https://keycloak.interlab/realms/ads/.well-known/openid-configuration"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_ISSUER: "https://keycloak.interlab/realms/ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_AUDIENCE: "ads-engine"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KEYCLOAK_CLIENT_ID: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_ENGINE_KAFKA_BOOTSTRAP_SERVERS: "kafka.kafka.svc.cluster.local:9092"' /tmp/ads-cm.yaml
          grep -q 'ads.io/application-node: "true"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_WELL_KNOWN_URL: "https://keycloak.interlab/realms/ads/.well-known/openid-configuration"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_ISSUER: "https://keycloak.interlab/realms/ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_CLIENT_ID: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_AUDIENCE: "ads"' /tmp/ads-cm.yaml
          grep -q 'ADS_KEYCLOAK_ROLE: "user"' /tmp/ads-cm.yaml
          if grep -qE 'kind: Keycloak(RealmImport)?$|k8s\.keycloak\.org' /tmp/ads-cm.yaml; then
            echo 'Keycloak CRDs must not be rendered' >&2
            exit 1
          fi
          if grep -q 'ADS_TLS_ENABLED' /tmp/ads-cm.yaml; then
            echo 'plain HTTP toggle still present' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES \
            --set tls.certManager.enabled=false \
            --set tls.serviceSecretName=byo-service \
            --set tls.policySecretName=byo-policy \
            --set tls.auditSecretName=byo-audit \
            --set preferences.tls.serviceSecretName=byo-preferences \
            >/tmp/ads-byo.yaml
          if grep -q 'kind: Certificate' /tmp/ads-byo.yaml; then
            echo 'BYO template still issues Certificates' >&2
            exit 1
          fi
          grep -q 'secretName: byo-service' /tmp/ads-byo.yaml
          grep -q 'secretName: byo-policy' /tmp/ads-byo.yaml
          grep -q 'secretName: byo-audit' /tmp/ads-byo.yaml
          grep -q 'secretName: byo-preferences' /tmp/ads-byo.yaml
          grep -q 'kind: HTTPRoute' /tmp/ads-byo.yaml
          if helm template ads charts/ads $VALUES --set=tls.certManager.enabled=false >/tmp/ads-byo-missing.yaml; then
            echo 'BYO without secrets should fail' >&2
            exit 1
          fi
          helm template ads charts/ads $VALUES \
            --set tls.caBundle.secretName=lab-ca \
            >/tmp/ads-ca.yaml
          grep -q 'ADS_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
          grep -q 'ADS_ENGINE_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
          grep -q 'ADS_PREFERENCES_TLS_CA_BUNDLE: "/ca/ca.crt"' /tmp/ads-ca.yaml
