name: publish-egress

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag for ghcr.io (e.g. 0.0.71-debug)
        required: false
        default: "0.0.71-debug"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  TESTCONTAINERS_RYUK_DISABLED: "true"

jobs:
  egress-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Provision real egress TLS, DNS and normalization test clients
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nginx libnginx-mod-http-lua bind9-dnsutils libzstd1 \
            libfstrm0 libprotobuf-c1 liburcu8t64 libjemalloc2 liblmdb0
          root="$RUNNER_TEMP/ads-openssl4"
          mkdir -p "$root"
          # OpenSSL 4.0.2 is pinned by ads_sandbox_egress.tls; the live pool
          # drops superseded versions, so fetch the exact debs from snapshot.
          curl --fail --show-error --location \
            https://snapshot.debian.org/archive/debian/20260826T022714Z/pool/main/o/openssl/libssl4_4.0.2-1_amd64.deb \
            --output "$root/libssl.deb"
          curl --fail --show-error --location \
            https://snapshot.debian.org/archive/debian/20260826T022714Z/pool/main/o/openssl/openssl_4.0.2-1_amd64.deb \
            --output "$root/openssl.deb"
          echo "1e265574c02f4918092d2f09e63cf368b21f15108b667790633f038717ded260  $root/libssl.deb" | sha256sum --check
          echo "657b368d7ae7c57cb85e24766a6e4f756b45e4f275dc991b2697b8cc648d7f6b  $root/openssl.deb" | sha256sum --check
          dpkg-deb --extract "$root/libssl.deb" "$root"
          dpkg-deb --extract "$root/openssl.deb" "$root"
          echo "ADS_EGRESS_OPENSSL4_ROOT=$root" >> "$GITHUB_ENV"
          # BIND 9.18 stops at the first invalid signature, losing a valid
          # alternative depending on RR ordering. Preserve the tests and use
          # an independent validator that implements their required behavior.
          bind_root="$RUNNER_TEMP/ads-bind920"
          mkdir -p "$bind_root/bin"
          curl --fail --show-error --location \
            'https://deb.debian.org/debian/pool/main/b/bind9/bind9-dnsutils_9.20.23-1~deb13u1~bpo12+1_amd64.deb' \
            --output "$bind_root/dnsutils.deb"
          curl --fail --show-error --location \
            'https://deb.debian.org/debian/pool/main/b/bind9/bind9-libs_9.20.23-1~deb13u1~bpo12+1_amd64.deb' \
            --output "$bind_root/libs.deb"
          echo "68a0a6f16dcc8c483a714211088e87c7c6b9965bff382d1cbd28921fae38ee2d  $bind_root/dnsutils.deb" | sha256sum --check
          echo "d7b783972b10cfc5375c9f017825ab5d48c3fe2e5ab4a3db56a21ef8651843d5  $bind_root/libs.deb" | sha256sum --check
          dpkg-deb --extract "$bind_root/dnsutils.deb" "$bind_root"
          dpkg-deb --extract "$bind_root/libs.deb" "$bind_root"
          printf '#!/bin/sh\nexport LD_LIBRARY_PATH="%s/usr/lib/x86_64-linux-gnu"\nexec "%s/usr/bin/delv" "$@"\n' \
            "$bind_root" "$bind_root" > "$bind_root/bin/delv"
          chmod 755 "$bind_root/bin/delv"
          "$bind_root/bin/delv" -v
          echo "$bind_root/bin" >> "$GITHUB_PATH"
      - name: Egress tests only
        run: |
          uv sync --group test
          uv run --group test pytest services/ads-sandbox-egress/tests -v

  publish-image:
    needs: [egress-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/ads-sandbox-egress
          tags: |
            type=raw,value=${{ inputs.image_tag }}
            type=sha,prefix=${{ inputs.image_tag }}-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/ads-sandbox-egress/Containerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/yet-another-solutions/ads
          provenance: true
          sbom: true
          cache-from: type=gha,scope=publish-ads-sandbox-egress
          cache-to: type=gha,mode=max,scope=publish-ads-sandbox-egress
      - name: Smoke - control-plane import and native TLS
        run: |
          set -euo pipefail
          tag="${{ inputs.image_tag }}"
          image="${REGISTRY}/${OWNER}/ads-sandbox-egress:${tag}"
          docker pull --platform linux/amd64 "$image"
          docker run --rm --platform linux/amd64 --entrypoint python "$image" -c \
            "from pathlib import Path; import ads_sandbox_egress.runtime; from ads_sandbox_egress.tls import TLSLibrary; TLSLibrary(Path('/opt/ads-openssl/lib')); print('egress smoke ok')"
