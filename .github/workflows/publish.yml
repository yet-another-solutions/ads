name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without pushing
        required: false
        default: "false"
      session_size:
        description: ADS_SESSION_SIZE baked into the release
        required: false
        default: "20Gi"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  ADS_SESSION_SIZE: ${{ github.event.inputs.session_size || '20Gi' }}

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.rel.outputs.image_tag }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
    steps:
      - name: Resolve channel
        id: rel
        run: |
          set -eu
          image_tag="0.0.1"
          prerelease=true
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            image_tag="$tag"
            prerelease=false
            case "$tag" in
              0.0.*|*pre*|*rc*|*alpha*|*beta*)
                prerelease=true
                ;;
            esac
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag} prerelease=${prerelease}"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Nox
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          uv sync --group dev --group lint --group deps --group typecheck --group test
          uv run --group dev nox -s lint deps typecheck test package

  publish-image:
    needs: [channel, python]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: ads
            file: services/ads/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-egress-controlplane
            file: services/ads-egress-controlplane/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-engine
            file: services/ads-engine/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-policy
            file: services/ads-policy/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-audit
            file: services/ads-audit/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-preferences
            file: services/ads-preferences/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-guardrail
            file: services/ads-guardrail/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-mcp-probe
            file: services/ads-mcp-probe/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-injection-scanner
            file: services/ads-injection-scanner/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-sandbox-golden
            file: services/ads-sandbox-golden/Containerfile
            context: services/ads-sandbox-golden
            platforms: linux/amd64
            pack: "true"
          - image: ads-sandbox-base
            file: services/ads-sandbox-base/Containerfile
            context: services/ads-sandbox-base
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-sandbox-mcp
            file: services/ads-sandbox-mcp/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-sandbox-ipc
            file: services/ads-sandbox-ipc/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
          - image: ads-sandbox-manager
            file: services/ads-sandbox-manager/Containerfile
            context: .
            platforms: linux/amd64,linux/arm64
            pack: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
        if: matrix.pack != 'true'
      - uses: docker/setup-buildx-action@v3
      - name: Install zstd
        if: matrix.pack == 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Pack inner rootfs
        if: matrix.pack == 'true'
        run: |
          set -euo pipefail
          echo "ADS_SESSION_SIZE=${ADS_SESSION_SIZE}"
          docker buildx build --load --platform linux/amd64 \
            -f services/ads-sandbox-golden/Containerfile.inner \
            -t ads-sandbox-inner:ci \
            services/ads-sandbox-golden
          cid=$(docker create --platform linux/amd64 ads-sandbox-inner:ci /bin/true)
          rm -f services/ads-sandbox-golden/rootfs.tar.zst
          docker export "$cid" | python3 services/ads-sandbox-golden/scripts/pack-rootfs | zstd -T0 -19 -o services/ads-sandbox-golden/rootfs.tar.zst
          docker rm "$cid" >/dev/null
          docker rmi ads-sandbox-inner:ci >/dev/null || true
          bytes=$(stat -c '%s' services/ads-sandbox-golden/rootfs.tar.zst)
          echo "rootfs.tar.zst ${bytes} bytes"
          if [ "$bytes" -lt 1024 ]; then
            echo "compressed rootfs too small" >&2
            exit 1
          fi
          if [ "$bytes" -ge 1073741824 ]; then
            echo "compressed rootfs exceeds 1Gi (sparse disk in image?)" >&2
            exit 1
          fi
      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.channel.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.channel.outputs.prerelease == 'false' }}
            type=sha,prefix=${{ needs.channel.outputs.image_tag }}-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          # The release a journal row was decided by; images that write none ignore it.
          build-args: |
            ADS_BUILD=${{ needs.channel.outputs.image_tag }}@${{ github.sha }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/yet-another-solutions/ads
          provenance: true
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}

  realm-sample:
    needs: [channel, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Stage standalone Keycloak sample
        env:
          IMAGE_TAG: ${{ needs.channel.outputs.image_tag }}
        run: |
          mkdir -p dist
          cp deploy/keycloak/ads-realm-import.sample.yaml "dist/ads-keycloak-realm-${IMAGE_TAG}.yaml"
          cp deploy/keycloak/README.md "dist/ads-keycloak-realm-${IMAGE_TAG}.README.md"
      - uses: actions/upload-artifact@v4
        with:
          name: ads-keycloak-realm-${{ needs.channel.outputs.image_tag }}
          path: dist/ads-keycloak-realm-*
          if-no-files-found: error

  chart:
    needs: [channel, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Package helm chart
        env:
          IMAGE_TAG: ${{ needs.channel.outputs.image_tag }}
        run: |
          python3 charts/ads/package_release.py --version "${IMAGE_TAG}" --session-size "${ADS_SESSION_SIZE}"
          helm lint charts/ads
          mkdir -p dist
          helm package charts/ads --destination dist
      - uses: actions/upload-artifact@v4
        with:
          name: ads-chart-${{ needs.channel.outputs.image_tag }}
          path: dist/*.tgz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [channel, python, publish-image, realm-sample, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ads-keycloak-realm-${{ needs.channel.outputs.image_tag }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: ads-chart-${{ needs.channel.outputs.image_tag }}
          path: dist
      - name: Attach chart and standalone Keycloak sample to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/ads-keycloak-realm-*.yaml
            dist/ads-keycloak-realm-*.README.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
