name: publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build without pushing
        required: false
        default: "false"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}
  UV_DEFAULT_INDEX: https://pypi.org/simple

jobs:
  channel:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.rel.outputs.image_tag }}
      prerelease: ${{ steps.rel.outputs.prerelease }}
    steps:
      - name: Resolve channel
        id: rel
        run: |
          set -eu
          image_tag="0.0.1"
          prerelease=true
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            image_tag="$tag"
            prerelease=false
            case "$tag" in
              0.0.*|*pre*|*rc*|*alpha*|*beta*)
                prerelease=true
                ;;
            esac
          fi
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${image_tag} prerelease=${prerelease}"

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Nox
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
        run: |
          uv sync --group dev --group lint --group deps --group typecheck --group test
          uv run --group dev nox -s lint deps typecheck test package

  publish-image:
    needs: [channel, python]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - image: ads
            file: services/ads/Containerfile
          - image: ads-egress-controlplane
            file: services/ads-egress-controlplane/Containerfile
          - image: ads-engine
            file: services/ads-engine/Containerfile
          - image: ads-policy
            file: services/ads-policy/Containerfile
          - image: ads-audit
            file: services/ads-audit/Containerfile
          - image: ads-preferences
            file: services/ads-preferences/Containerfile
          - image: ads-supervisor
            file: services/ads-supervisor/Containerfile
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase owner
        run: echo "OWNER=${OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ matrix.image }}
          tags: |
            type=raw,value=${{ needs.channel.outputs.image_tag }}
            type=raw,value=latest,enable=${{ needs.channel.outputs.prerelease == 'false' }}
            type=sha,prefix=${{ needs.channel.outputs.image_tag }}-
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/yet-another-solutions/ads
          provenance: true
          sbom: true
          cache-from: type=gha,scope=publish-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.image }}

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [channel, python, publish-image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Package helm chart
        env:
          IMAGE_TAG: ${{ needs.channel.outputs.image_tag }}
        run: |
          sed -i "s/^version: .*/version: ${IMAGE_TAG}/" charts/ads/Chart.yaml
          sed -i "s/^appVersion: .*/appVersion: \"${IMAGE_TAG}\"/" charts/ads/Chart.yaml
          mkdir -p dist
          helm package charts/ads --destination dist
      - name: Attach chart to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ needs.channel.outputs.prerelease == 'true' }}
