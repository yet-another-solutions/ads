apiVersion: v1
kind: ConfigMap
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "ads.fullname" . }}-engine
  labels:
    {{- include "ads.labels" . | nindent 4 }}
    app.kubernetes.io/component: ads-engine
data:
  ADS_ENGINE_KAFKA_BOOTSTRAP_SERVERS: {{ .Values.engine.kafka.bootstrapServers | quote }}
  ADS_ENGINE_REQUEST_TOPIC: {{ .Values.engine.kafka.requestTopic | quote }}
  ADS_ENGINE_OUTPUT_TOPIC: {{ .Values.engine.kafka.outputTopic | quote }}
  ADS_ENGINE_CONSUMER_GROUP: {{ .Values.engine.kafka.consumerGroup | quote }}
  ADS_ENGINE_PING_INTERVAL_SECONDS: {{ .Values.engine.pingIntervalSeconds | quote }}
  ADS_ENGINE_ACK_TIMEOUT_SECONDS: {{ .Values.engine.ackTimeoutSeconds | quote }}
  {{- if .Values.guardrail.enabled }}
  # Through the guardrail: every exec is decided, inspected and journalled on the way.
  ADS_ENGINE_MCP_URL: {{ printf "%s/mcp/sandbox" (include "ads.guardrailUrl" .) | quote }}
  {{- else }}
  ADS_ENGINE_MCP_URL: {{ printf "https://%s:%v/mcp" (include "ads.sandboxName" (dict "root" . "component" "mcp")) .Values.sandbox.mcp.port | quote }}
  {{- end }}
  ADS_ENGINE_MCP_TIMEOUT_SECONDS: {{ .Values.engine.mcpTimeoutSeconds | quote }}
  ADS_ENGINE_MAX_TOOL_CALLS: {{ .Values.engine.maxToolCalls | quote }}
  ADS_ENGINE_KEYCLOAK_WELL_KNOWN_URL: {{ .Values.engine.keycloak.wellKnownUrl | quote }}
  ADS_ENGINE_KEYCLOAK_ISSUER: {{ .Values.engine.keycloak.issuer | quote }}
  ADS_ENGINE_KEYCLOAK_AUDIENCE: {{ .Values.engine.keycloak.audience | quote }}
  ADS_ENGINE_KEYCLOAK_CLIENT_ID: {{ .Values.engine.keycloak.clientId | quote }}
  ADS_ENGINE_ALLOWED_CALLERS: {{ .Values.engine.keycloak.allowedCallers | join "," | quote }}
  ADS_ENGINE_ACK_AUDIENCE: {{ .Values.engine.keycloak.ackAudience | quote }}
  {{- if .Values.tls.caBundle.secretName }}
  ADS_ENGINE_TLS_CA_BUNDLE: "/ca/ca.crt"
  {{- end }}
  {{- if .Values.guardrail.enabled }}
  {{- if not .Values.tls.caBundle.secretName }}
  {{- fail "guardrail.enabled needs tls.caBundle.secretName: the engine must trust the guardrail's certificate" }}
  {{- end }}
  ADS_ENGINE_GUARDRAIL_URL: {{ include "ads.guardrailUrl" . | quote }}
  ADS_ENGINE_WORKSPACE_PROJECT: {{ required "engine.workspace.project is required with the guardrail" .Values.engine.workspace.project | quote }}
  ADS_ENGINE_WORKSPACE_REPO: {{ required "engine.workspace.repo is required with the guardrail" .Values.engine.workspace.repo | quote }}
  ADS_ENGINE_WORKSPACE_ENV: {{ required "engine.workspace.env is required with the guardrail" .Values.engine.workspace.env | quote }}
  ADS_ENGINE_WORKSPACE_WORKDIR: {{ .Values.engine.workspace.workdir | default .Values.policy.workdir | quote }}
  {{- end }}
  {{- with .Values.engine.tools }}
  {{- if .enabled }}
  {{- if not $.Values.guardrail.enabled }}
  {{- fail "engine.tools.enabled needs guardrail.enabled: every tool call goes through it" }}
  {{- end }}
  {{- $servers := .mcpServers }}
  {{- if not $servers }}
  {{- range (include "ads.mcpProbeServers" $ | fromJsonArray) }}
  {{- $servers = append $servers .name }}
  {{- end }}
  {{- end }}
  ADS_ENGINE_MCP_SERVERS: {{ required "engine.tools.mcpServers is required (or enable mcpProbe)" (join "," $servers) | quote }}
  ADS_ENGINE_MCP_AUDIENCE: {{ .mcpAudience | quote }}
  ADS_ENGINE_MAX_MODEL_ROUNDS: {{ .maxModelRounds | quote }}
  ADS_ENGINE_TOOL_CALL_ATTEMPTS: {{ .callAttempts | quote }}
  {{- end }}
  {{- end }}
