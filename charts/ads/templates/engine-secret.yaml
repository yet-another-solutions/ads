apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "ads.fullname" . }}-engine
  labels:
    {{- include "ads.labels" . | nindent 4 }}
    app.kubernetes.io/component: ads-engine
type: Opaque
stringData:
  ADS_ENGINE_KEYCLOAK_CLIENT_SECRET: {{ required "secrets.engineKeycloakClientSecret is required" .Values.secrets.engineKeycloakClientSecret | quote }}
  ADS_ENGINE_DATABASE_URL: {{ required "engine.database.url is required" .Values.engine.database.url | quote }}
  {{- if .Values.guardrail.enabled }}
  ADS_ENGINE_GUARDRAIL_API_TOKEN: {{ required "secrets.guardrailApiToken is required with the guardrail: the engine opens runs with it" .Values.secrets.guardrailApiToken | quote }}
  {{- end }}
