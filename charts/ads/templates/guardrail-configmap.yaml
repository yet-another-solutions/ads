{{- if .Values.guardrail.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ads.fullname" . }}-guardrail
  labels:
    {{- include "ads.labels" . | nindent 4 }}
data:
  ADS_BIND_HOST: "0.0.0.0"
  ADS_PORT: {{ .Values.guardrail.service.port | quote }}
  ADS_TLS_CERT_PATH: "/certs/tls.crt"
  ADS_TLS_KEY_PATH: "/certs/tls.key"
  {{- with include "ads.caBundlePath" . }}
  ADS_TLS_CA_BUNDLE: {{ . | quote }}
  {{- end }}
  ADS_POLICY_URL: {{ include "ads.policyUrl" . | quote }}
  ADS_ATTRIBUTES: {{ join "," .Values.guardrail.attributes | quote }}
  ADS_MCP_AUDIENCE: {{ .Values.guardrail.personTokenAudience | quote }}
  ADS_KEYCLOAK_WELL_KNOWN_URL: {{ .Values.keycloak.wellKnownUrl | quote }}
  ADS_KEYCLOAK_ISSUER: {{ .Values.keycloak.issuer | quote }}
  {{- if .Values.injectionScanner.enabled }}
  ADS_INJECTION_SCANNER_URL: {{ include "ads.injectionScannerUrl" . | quote }}
  {{- end }}
  {{- $servers := list }}
  {{- range (include "ads.mcpProbeServers" . | fromJsonArray) }}
  {{- $servers = append $servers (dict "name" .name "url" .url "site" (include "ads.guardrailSite" .site | fromJson)) }}
  {{- end }}
  {{- range .Values.guardrail.mcpServers }}
  {{- $servers = append $servers (dict
        "name" (required "guardrail.mcpServers[].name is required" .name)
        "url" (required "guardrail.mcpServers[].url is required" .url)
        "site" (include "ads.guardrailSite" (required "guardrail.mcpServers[].site is required" .site) | fromJson)) }}
  {{- end }}
  ADS_MCP_SERVERS: {{ toJson $servers | quote }}
  {{- $applications := list }}
  {{- range .Values.guardrail.applications }}
  {{- $workspace := required "guardrail.applications[].workspace is required" .workspace }}
  {{- $applications = append $applications (dict
        "name" (required "guardrail.applications[].name is required" .name)
        "key_sha256" (required "guardrail.applications[].keySha256 is required" .keySha256)
        "workspace" (dict
          "project" (required "guardrail.applications[].workspace.project is required" $workspace.project)
          "repo" (required "guardrail.applications[].workspace.repo is required" $workspace.repo)
          "env" (required "guardrail.applications[].workspace.env is required" $workspace.env)
          "workdir" ($workspace.workdir | default $.Values.policy.workdir))) }}
  {{- end }}
  ADS_APPLICATIONS: {{ toJson $applications | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ads.fullname" . }}-guardrail
  labels:
    {{- include "ads.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADS_GUARDRAIL_API_TOKEN: {{ required "secrets.guardrailApiToken is required: it guards the permissions API" .Values.secrets.guardrailApiToken | quote }}
  ADS_POLICY_API_TOKEN: {{ required "secrets.policyApiToken is required: guardrail asks the policy service with it" .Values.secrets.policyApiToken | quote }}
  {{- if .Values.injectionScanner.enabled }}
  ADS_INJECTION_SCANNER_API_TOKEN: {{ required "secrets.injectionScannerApiToken is required with the injection scanner" .Values.secrets.injectionScannerApiToken | quote }}
  {{- end }}
  ADS_AMQP_URL: {{ required "audit.rabbitmq.url is required: decisions are journalled through RabbitMQ" .Values.audit.rabbitmq.url | quote }}
{{- end }}
