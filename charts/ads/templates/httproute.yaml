{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ads.fullname" . }}-service
  labels:
    {{- include "ads.labels" . | nindent 4 }}
spec:
  secretName: {{ include "ads.serviceSecretName" . }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuer.name }}
    kind: {{ .Values.tls.certManager.issuer.kind }}
    group: {{ .Values.tls.certManager.issuer.group }}
  dnsNames:
    - {{ .Values.httpRoute.hostname | quote }}
    - {{ include "ads.fullname" . | quote }}
    - {{ printf "%s.%s" (include "ads.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc" (include "ads.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" (include "ads.fullname" .) .Release.Namespace | quote }}
---
{{- end }}
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "ads.fullname" . }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
spec:
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  parentRefs:
    - name: {{ .Values.httpRoute.gateway.name }}
      namespace: {{ .Values.httpRoute.gateway.namespace }}
      sectionName: {{ .Values.httpRoute.gateway.sectionName }}
  rules:
    - filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Proto
                value: https
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: {{ include "ads.fullname" . }}
          port: {{ .Values.service.port }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: {{ include "ads.fullname" . }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: {{ include "ads.fullname" . }}
      sectionName: https
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ .Values.httpRoute.backendTLS.caConfigMapName }}
    hostname: {{ .Values.httpRoute.hostname | quote }}
{{- end }}
