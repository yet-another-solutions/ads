apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ads.fullname" . }}-policy
  labels:
    {{- include "ads.labels" . | nindent 4 }}
data:
  ADS_BIND_HOST: "0.0.0.0"
  ADS_PORT: {{ .Values.policy.service.port | quote }}
  ADS_TLS_CERT_PATH: "/certs/tls.crt"
  ADS_TLS_KEY_PATH: "/certs/tls.key"
  {{- with include "ads.caBundlePath" . }}
  ADS_TLS_CA_BUNDLE: {{ . | quote }}
  {{- end }}
  ADS_POLICY_DIR: {{ .Values.policy.mountPath | quote }}
  ADS_POLICY_MODE: {{ .Values.policy.mode | quote }}
  ADS_POLICY_DENY_ON_ERROR: {{ .Values.policy.denyOnPolicyError | quote }}
  ADS_SANDBOX_AVAILABLE: {{ include "ads.sandboxAvailable" . | trim | quote }}
  ADS_RUN_WORKDIR: {{ .Values.policy.workdir | quote }}
  ADS_RUN_TTL_SECONDS: {{ .Values.policy.runTtlSeconds | quote }}
  ADS_POLICY_RELOAD_SECONDS: {{ .Values.policy.reloadSeconds | quote }}
  ADS_EGRESS_ALLOWLIST: {{ join "," .Values.policy.egressAllowlist | quote }}
  ADS_PROTECTED_BRANCHES: {{ join "," .Values.policy.protectedBranches | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ads.fullname" . }}-policy
  labels:
    {{- include "ads.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADS_POLICY_API_TOKEN: {{ required "secrets.policyApiToken is required: it guards every decision the service makes" .Values.secrets.policyApiToken | quote }}
  ADS_REDIS_URL: {{ required "policy.redis.url is required: the policy service keeps runs in Redis" .Values.policy.redis.url | quote }}
  ADS_AMQP_URL: {{ required "audit.rabbitmq.url is required: decisions are journalled through RabbitMQ" .Values.audit.rabbitmq.url | quote }}
