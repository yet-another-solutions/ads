apiVersion: v1
kind: Service
metadata:
  name: {{ include "ads.fullname" . }}-policy
  labels:
    {{- include "ads.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.policy.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "ads.policySelectorLabels" . | nindent 4 }}
---
{{- if .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "ads.fullname" . }}-policy
  labels:
    {{- include "ads.labels" . | nindent 4 }}
spec:
  secretName: {{ include "ads.policySecretName" . }}
  issuerRef:
    name: {{ .Values.tls.certManager.issuer.name }}
    kind: {{ .Values.tls.certManager.issuer.kind }}
    group: {{ .Values.tls.certManager.issuer.group }}
  dnsNames:
    - {{ printf "%s-policy" (include "ads.fullname" .) | quote }}
    - {{ printf "%s-policy.%s" (include "ads.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s-policy.%s.svc" (include "ads.fullname" .) .Release.Namespace | quote }}
    - {{ printf "%s-policy.%s.svc.cluster.local" (include "ads.fullname" .) .Release.Namespace | quote }}
{{- end }}
