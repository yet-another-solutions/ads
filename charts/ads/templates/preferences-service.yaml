apiVersion: v1
kind: Service
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "ads.fullname" . }}-preferences
  labels:
    {{- include "ads.labels" . | nindent 4 }}
    app.kubernetes.io/component: ads-preferences
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.preferences.service.port }}
      targetPort: https
      protocol: TCP
      name: https
  selector:
    {{- include "ads.preferencesSelectorLabels" . | nindent 4 }}
