{{- if contains "PRIVATE KEY" .Values.sandbox.ca.additionalTrustPEM }}
{{- fail "sandbox.ca.additionalTrustPEM must contain public certificates only" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ads.fullname" . }}-egress-extra-trust
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
data:
  ca.crt: {{ .Values.sandbox.ca.additionalTrustPEM | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ads-sandbox-ca-offline
  namespace: {{ .Values.sandbox.namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ads-sandbox-ca
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
