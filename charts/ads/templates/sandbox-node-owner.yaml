{{- $root := . -}}
{{- $sb := .Values.sandbox -}}
{{- $version := $root.Chart.AppVersion -}}
{{- $tools := include "ads.sandboxImage" (dict "root" $root "image" $sb.nodeOwner.image) -}}
{{- $attestorSocket := printf "/var/run/attestor-v%s.sock" $version -}}
{{- $ownerSocket := printf "/var/run/node-owner-v%s.sock" $version -}}
{{- $issuer := $root.Values.tls.certManager.issuer -}}
{{- $roles := list
    (dict "name" "ads-ptp-attestor" "cn" "ads-ptp-attestor" "port" 0)
    (dict "name" "ads-node-owner" "cn" "ads-node-owner" "port" 9443)
    (dict "name" "ads-ptp-cni" "cn" "ads-ptp-cni" "port" 0)
-}}
{{- range $role := $roles }}
{{- $secret := printf "%s-tls" $role.name }}
{{- $configured := or $root.Values.tls.certManager.enabled (index $sb.nodeOwner.secrets $role.name) }}
{{- if and (not $root.Values.tls.certManager.enabled) $configured }}
{{- $secret = index $sb.nodeOwner.secrets $role.name }}
{{- end }}
{{- if $configured }}
{{- if $root.Values.tls.certManager.enabled }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $role.name }}
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  secretName: {{ $secret }}
  commonName: {{ $role.cn }}
  issuerRef:
    name: {{ $issuer.name }}
    kind: {{ $issuer.kind }}
    group: {{ $issuer.group }}
  dnsNames:
    - {{ $role.cn | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ $role.name }}
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: {{ $role.name }}
  template:
    metadata:
      labels:
        {{- include "ads.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $role.name }}
    spec:
      serviceAccountName: {{ $role.name }}
      automountServiceAccountToken: false
      hostNetwork: false
      hostPID: true
      tolerations:
        - key: ads.io/sandbox
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: materialize-config
          image: {{ $tools | quote }}
          imagePullPolicy: {{ $sb.nodeOwner.image.pullPolicy }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              install -d -o root -g root -m 0700 /host-etc
              install -o root -g root -m 0600 /config/config.json /host-etc/config.json
              if [ -f /config/attestor.json ]; then
                install -o root -g root -m 0600 /config/attestor.json /host-etc/attestor.json
              fi
              if [ -d /tls-src ]; then
                install -d -o root -g root -m 0700 /host-etc/tls
                install -o root -g root -m 0600 /tls-src/ca.crt /host-etc/tls/ca.crt
                install -o root -g root -m 0600 /tls-src/tls.crt /host-etc/tls/tls.crt
                install -o root -g root -m 0600 /tls-src/tls.key /host-etc/tls/tls.key
              fi
              node="${NODE_NAME}"
              python3 - "$node" << 'PY'
              import json, pathlib, sys
              node = sys.argv[1]
              for name in ("config.json", "attestor.json"):
                  path = pathlib.Path("/host-etc") / name
                  if not path.exists():
                      continue
                  record = json.loads(path.read_text())
                  if "node" in record:
                      record["node"] = node
                  path.write_text(json.dumps(record))
              PY
              chmod 0600 /host-etc/config.json /host-etc/attestor.json 2>/dev/null || chmod 0600 /host-etc/config.json
              chown root:root /host-etc/config.json
              if [ -f /host-etc/attestor.json ]; then chown root:root /host-etc/attestor.json; fi
              install -d -o root -g root -m 0700 /host-state /host-state/bindings
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls-src
              readOnly: true
            - name: host-etc
              mountPath: /host-etc
            {{- if ne $role.name "ads-ptp-cni" }}
            - name: cni-state
              mountPath: /host-state
            {{- end }}
      containers:
        - name: {{ $role.name }}
          image: {{ $tools | quote }}
          imagePullPolicy: {{ $sb.nodeOwner.image.pullPolicy }}
          command: ["/usr/local/bin/{{ ternary "ads-ptp-attest" $role.name (eq $role.name "ads-ptp-attestor") }}"]
          args: ["/host-etc/config.json"]
          securityContext:
            privileged: true
            runAsUser: 0
            allowPrivilegeEscalation: true
          {{- if eq $role.name "ads-node-owner" }}
          ports:
            - name: https
              containerPort: 9443
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: host-etc
              mountPath: /host-etc
              readOnly: true
            - name: run
              mountPath: /var/run
            - name: tls
              mountPath: /tls
              readOnly: true
            {{- if ne $role.name "ads-ptp-cni" }}
            - name: host-cri
              mountPath: /run/containerd
            - name: host-crio
              mountPath: /var/run/crio
            {{- end }}
            {{- if or (eq $role.name "ads-ptp-attestor") (eq $role.name "ads-node-owner") }}
            - name: token
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- if eq $role.name "ads-ptp-cni" }}
            - name: cni-bin
              mountPath: /opt/cni/bin
            - name: cni-net
              mountPath: /etc/cni/net.d
            - name: crio-net
              mountPath: /etc/cni/net.d.crio
            - name: runtime-net
              mountPath: /etc/cni/ads-private
            - name: cni-certs
              mountPath: /etc/cni/ads-ptp
            - name: cni-state
              mountPath: /var/lib/ads-ptp
            {{- end }}
            {{- if eq $role.name "ads-node-owner" }}
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: attestor-etc
              mountPath: /etc/ads-ptp-attestor
              readOnly: true
            - name: cni-state
              mountPath: /var/lib/ads-ptp
            - name: kubelet-root
              mountPath: /var/lib/kubelet
              readOnly: true
              mountPropagation: HostToContainer
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ $role.name }}
            defaultMode: 0600
        - name: host-etc
          hostPath:
            path: /etc/{{ $role.name }}
            type: DirectoryOrCreate
        {{- if ne $role.name "ads-ptp-cni" }}
        - name: host-cri
          hostPath:
            path: /run/containerd
            type: DirectoryOrCreate
        - name: host-crio
          hostPath:
            path: /var/run/crio
            type: DirectoryOrCreate
        {{- end }}
        {{- if ne $role.name "ads-ptp-cni" }}
        - name: cni-state
          hostPath:
            path: /var/lib/ads-ptp
            type: DirectoryOrCreate
        {{- end }}
        - name: run
          hostPath:
            path: /var/run
            type: Directory
        - name: tls
          secret:
            secretName: {{ $secret }}
            defaultMode: 0600
        {{- if or (eq $role.name "ads-ptp-attestor") (eq $role.name "ads-node-owner") }}
        - name: token
          projected:
            defaultMode: 0600
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
        {{- end }}
        {{- if eq $role.name "ads-ptp-cni" }}
        - name: cni-bin
          hostPath:
            path: /opt/cni/bin
            type: Directory
        - name: cni-net
          hostPath:
            path: /etc/cni/net.d
            type: DirectoryOrCreate
        - name: crio-net
          hostPath:
            path: /etc/cni/net.d.crio
            type: DirectoryOrCreate
        - name: runtime-net
          hostPath:
            path: /etc/cni/ads-private
            type: DirectoryOrCreate
        - name: cni-certs
          hostPath:
            path: /etc/cni/ads-ptp
            type: DirectoryOrCreate
        - name: cni-state
          hostPath:
            path: /var/lib/ads-ptp
            type: DirectoryOrCreate
        {{- end }}
        {{- if eq $role.name "ads-node-owner" }}
        - name: proc
          hostPath:
            path: /proc
            type: Directory
        - name: kubelet-root
          hostPath:
            path: /var/lib/kubelet
            type: Directory
        - name: attestor-etc
          hostPath:
            path: /etc/ads-ptp-attestor
            type: DirectoryOrCreate
        {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $role.name }}
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $role.name }}
data:
  config.json: |
    {{- if eq $role.name "ads-ptp-attestor" }}
    {
      "node": "",
      "namespace": {{ $sb.namespace | quote }},
      "network": {{ $sb.manager.nodeOwner.network | quote }},
      "apiServer": "https://kubernetes.default.svc",
      "token": "/var/run/secrets/kubernetes.io/serviceaccount/token",
      "apiCa": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt",
      "relay_image": {{ $pair := $sb.manager.pairInputs | default dict }}{{ if dig "relay" "image" "" $pair }}{{ dig "relay" "image" "" $pair | quote }}{{ else }}"registry.invalid/relay:unconfigured"{{ end }},
      "relay_container": "relay",
      "guest_runtime": "kata-qemu-ads",
      "egress_runtime": "kata-qemu-ads-egress",
      "transport_mtu": {{ $sb.nodeOwner.transportMtu }},
      "attestorSocket": {{ $attestorSocket | quote }},
      "cniCN": "ads-ptp-cni",
      "nodeOwnerSocket": {{ $ownerSocket | quote }},
      "nodeOwnerCN": "ads-node-owner",
      "ca": "/host-etc/tls/ca.crt",
      "certificate": "/host-etc/tls/tls.crt",
      "key": "/host-etc/tls/tls.key"
    }
  attestor.json: |
    {
      "node": "",
      "namespace": {{ $sb.namespace | quote }},
      "network": {{ $sb.manager.nodeOwner.network | quote }},
      "apiServer": "https://kubernetes.default.svc",
      "token": "/var/run/secrets/kubernetes.io/serviceaccount/token",
      "apiCa": "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt",
      "relay_image": {{ $pair := $sb.manager.pairInputs | default dict }}{{ if dig "relay" "image" "" $pair }}{{ dig "relay" "image" "" $pair | quote }}{{ else }}"registry.invalid/relay:unconfigured"{{ end }},
      "relay_container": "relay",
      "guest_runtime": "kata-qemu-ads",
      "egress_runtime": "kata-qemu-ads-egress",
      "transport_mtu": {{ $sb.nodeOwner.transportMtu }},
      "attestorSocket": {{ $attestorSocket | quote }},
      "cniCN": "ads-ptp-cni",
      "nodeOwnerSocket": {{ $ownerSocket | quote }},
      "nodeOwnerCN": "ads-node-owner",
      "ca": "/host-etc/tls/ca.crt",
      "certificate": "/host-etc/tls/tls.crt",
      "key": "/host-etc/tls/tls.key"
    }
    {{- else if eq $role.name "ads-node-owner" }}
    {
      "node": "",
      "namespace": {{ $sb.namespace | quote }},
      "network": {{ $sb.manager.nodeOwner.network | quote }},
      "bind": "0.0.0.0",
      "port": 9443,
      "ca": "/host-etc/tls/ca.crt",
      "certificate": "/host-etc/tls/tls.crt",
      "key": "/host-etc/tls/tls.key",
      "manager_cn": "ads-sandbox-manager",
      "attestor_cn": "ads-ptp-attestor",
      "socket": {{ $ownerSocket | quote }},
      "pair": {"attestorConfig": "/etc/ads-ptp-attestor/attestor.json", "stateDir": "/var/lib/ads-ptp", "kubeletRoot": "/var/lib/kubelet"},
      "ipc": null
    }
    {{- else }}
    {
      "cniVersion": "1.0.0",
      "name": {{ $sb.manager.nodeOwner.network | quote }},
      "type": "ads-ptp",
      "attestorSocket": {{ $attestorSocket | quote }},
      "attestorCN": "ads-ptp-attestor",
      "ca": "/host-etc/tls/ca.crt",
      "certificate": "/host-etc/tls/tls.crt",
      "key": "/host-etc/tls/tls.key",
      "stateDir": "/var/lib/ads-ptp",
      "bindingDir": "/var/lib/ads-ptp/bindings",
      "ownerSocket": {{ $ownerSocket | quote }}
    }
    {{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $role.name }}
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
automountServiceAccountToken: false
{{- if or (eq $role.name "ads-ptp-attestor") (eq $role.name "ads-node-owner") }}
---
# Read-only Pod/PVC/PV observation for the in-process Kubernetes API client.
# No exec, no secrets, no mutations. Mirrors deploy/node-owner/rbac.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $role.name }}-observer
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $role.name }}-observer
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $role.name }}-observer
subjects:
  - kind: ServiceAccount
    name: {{ $role.name }}
    namespace: {{ $sb.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $role.name }}-storage-observer
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $sb.namespace }}-{{ $role.name }}-storage-observer
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $role.name }}-storage-observer
subjects:
  - kind: ServiceAccount
    name: {{ $role.name }}
    namespace: {{ $sb.namespace }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ads-node-owner
  namespace: {{ $sb.namespace }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: ads-node-owner
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $root.Values.namespace | quote }}
          podSelector:
            matchLabels:
              app.kubernetes.io/component: ads-sandbox-manager
      ports:
        - protocol: TCP
          port: 9443
{{- end }}
