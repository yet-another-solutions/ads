apiVersion: v1
kind: ServiceAccount
metadata:
  name: ads-sandbox-manager
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ads-sandbox-ipc
  namespace: {{ .Values.sandbox.namespace }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get]
  - apiGroups: [scheduling.k8s.io]
    resources: [podgroups]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-ads-sandbox-manager-observe
rules:
  - apiGroups: [""]
    resources: [persistentvolumes, nodes]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [list]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-ads-sandbox-manager-observe
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.namespace }}-ads-sandbox-manager-observe
subjects:
  - kind: ServiceAccount
    name: ads-sandbox-manager
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: ads-sandbox-manager
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-ipc
  namespace: {{ .Values.sandbox.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-ipc
  namespace: {{ .Values.sandbox.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-ipc
subjects:
  - kind: ServiceAccount
    name: ads-sandbox-ipc
    namespace: {{ .Values.sandbox.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-admission
  namespace: {{ .Values.sandbox.namespace }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-admission
  namespace: {{ .Values.sandbox.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-admission
subjects:
  - kind: ServiceAccount
    name: {{ .Values.sandbox.admission.serviceAccountName }}
    namespace: {{ .Values.sandbox.admission.kyvernoNamespace }}
