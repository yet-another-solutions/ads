{{- $root := . -}}
{{- $sb := .Values.sandbox -}}
{{- range $component, $settings := dict "mcp" $sb.mcp "manager" $sb.manager "ipc" $sb.ipc }}
{{- if not $settings.existingSecret }}
{{- $prefix := printf "ADS_SANDBOX_%s_" (upper $component) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ads.sandboxName" (dict "root" $root "component" $component) }}
  namespace: {{ ternary $sb.namespace $root.Values.namespace (eq $component "ipc") }}
  labels:
    {{- include "ads.labels" $root | nindent 4 }}
    app.kubernetes.io/component: ads-sandbox-{{ $component }}
type: Opaque
stringData:
  {{ $prefix }}KEYCLOAK_CLIENT_SECRET: {{ required (printf "sandbox.%s.keycloakClientSecret is required" $component) $settings.keycloakClientSecret | quote }}
  {{- if ne $component "ipc" }}
  {{ $prefix }}DATABASE_URL: {{ required (printf "sandbox.%s.databaseUrl is required" $component) $settings.databaseUrl | quote }}
  {{- end }}
  {{- if and (eq $component "manager") (hasPrefix "SASL" $sb.manager.kafka.securityProtocol) }}
  {{ $prefix }}KAFKA_SASL_USERNAME: {{ $sb.manager.kafka.saslUsername | quote }}
  {{ $prefix }}KAFKA_SASL_PASSWORD: {{ $sb.manager.kafka.saslPassword | quote }}
  {{- end }}
{{- end }}
{{- end }}
