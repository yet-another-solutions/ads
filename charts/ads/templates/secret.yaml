apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ads.fullname" . }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADS_KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  ADS_SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  ADS_POLICY_API_TOKEN: {{ .Values.secrets.policyApiToken | quote }}
  ADS_DATABASE_URL: {{ required "database.url is required: sessions live in PostgreSQL" .Values.database.url | quote }}
