apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "ads.fullname" . }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADS_KEYCLOAK_CLIENT_SECRET: {{ required "secrets.keycloakClientSecret is required" .Values.secrets.keycloakClientSecret | quote }}
  ADS_SESSION_SECRET: {{ required "secrets.sessionSecret is required: it signs the session cookie" .Values.secrets.sessionSecret | quote }}
  ADS_POLICY_API_TOKEN: {{ required "secrets.policyApiToken is required: it is how a service proves it may ask for a decision" .Values.secrets.policyApiToken | quote }}
  ADS_DATABASE_URL: {{ required "database.url is required: sessions live in PostgreSQL" .Values.database.url | quote }}
  ADS_AMQP_URL: {{ required "audit.rabbitmq.url is required: an auditor's reading is journalled through RabbitMQ" .Values.audit.rabbitmq.url | quote }}
