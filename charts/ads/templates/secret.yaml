apiVersion: v1
kind: Secret
metadata:
  namespace: {{ .Values.namespace }}
  name: {{ include "ads.fullname" . }}
  labels:
    {{- include "ads.labels" . | nindent 4 }}
type: Opaque
stringData:
  ADS_DATABASE_URL: {{ .Values.database.url | quote }}
  ADS_KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  ADS_SESSION_SECRET: {{ .Values.secrets.sessionSecret | quote }}
  {{- if and (hasPrefix "SASL" .Values.kafka.securityProtocol) (not .Values.kafka.existingSecret) }}
  ADS_KAFKA_SASL_USERNAME: {{ required "kafka.saslUsername required for SASL" .Values.kafka.saslUsername | quote }}
  ADS_KAFKA_SASL_PASSWORD: {{ required "kafka.saslPassword required for SASL" .Values.kafka.saslPassword | quote }}
  {{- end }}
