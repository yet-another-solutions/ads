# Over values-local.yaml: the local stand with the session sandbox as the only tool
# server, reached through the guardrail, and no MCP probe at all.
#
#   helm template ads charts/ads -n default -f charts/ads/values-local.yaml \
#     -f charts/ads/values-local-sandbox.yaml -f <policy.example.yaml as policy.document>
#
# Rendered for a machine without helm into deploy/local/rendered-sandbox.yaml.

# No probe Deployment, Service or guardrail server.
mcpProbe:
  enabled: false

# The engine takes the sandbox executor instead of the probe tool loop. It still opens
# a run through the guardrail and reaches the sandbox only at /mcp/sandbox. The person's
# prompt is not inspected on this path: only the probe tool loop asks the guardrail to.
engine:
  tools:
    enabled: false
