# Overrides for a throwaway local cluster (kind / minikube).
# See deploy/local/README.md for the order things have to happen in.
#
#   helm install ads charts/ads -n ads --create-namespace -f charts/ads/values-local.yaml

# Images are built locally and loaded into the node, never pulled.
image:
  repository: ads
  tag: local
  pullPolicy: Never

policy:
  image:
    repository: ads-policy
    tag: local
    pullPolicy: Never
  # deploy/local/dependencies.yaml runs Redis without TLS.
  redis:
    url: redis://ads-redis:6379/0
  # Short enough to watch a run expire without waiting an hour.
  runTtlSeconds: 300

audit:
  image:
    repository: ads-audit
    tag: local
    pullPolicy: Never
  rabbitmq:
    url: amqp://guest:guest@ads-rabbitmq:5672/
  postgres:
    url: postgresql+asyncpg://ads:ads@ads-postgres:5432/ads_audit

engine:
  # Off here. Unlike the web app, which discovers Keycloak lazily on the first login,
  # the engine fetches the openid configuration while building its container and dies
  # when it cannot — and there is no Keycloak on a throwaway cluster. Nothing in the
  # governance layer depends on it.
  replicaCount: 0
  image:
    repository: ads-engine
    tag: local
    pullPolicy: Never
  # deploy/local/dependencies.yaml runs a single-node Kafka without TLS.
  kafka:
    bootstrapServers: ads-kafka:9092

egressControlplane:
  image:
    repository: ads-egress-controlplane
    tag: local
    pullPolicy: Never

# A throwaway cluster has no Gateway API CRDs, and helm install fails outright on an
# unknown kind rather than leaving the route inert. The serving certificates do not
# depend on it, so the pods still come up with TLS; there is simply no way in from
# outside, which is what port-forward is for.
httpRoute:
  enabled: false
  hostname: ads.local

# cert-manager signs everything with the local CA from
# deploy/local/cert-manager-issuer.yaml. The same CA is mounted into the pods so ads
# can verify the policy service; without it every decision fails closed.
tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  caBundle:
    secretName: ads-ca
    key: ca.crt

secrets:
  keycloakClientSecret: unused-on-a-local-cluster
  sessionSecret: local-session-secret-32-bytes
  policyApiToken: local-policy-token-32-bytes
  auditApiToken: local-audit-token-32-bytes

resources:
  requests:
    cpu: 50m
    memory: 96Mi
