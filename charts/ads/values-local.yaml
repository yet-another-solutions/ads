# Overrides for a throwaway local cluster (kind / minikube): the whole chain, from the
# browser to the MCP probe. See deploy/local/README.md; deploy/local/up.sh does it all
# in order, and applies deploy/local/rendered.yaml where there is no helm.
#
#   helm upgrade --install ads charts/ads -n ads -f charts/ads/values-local.yaml \
#     -f <policy.example.yaml wrapped under policy.document>
#
# After changing this file or the chart, render deploy/local/rendered.yaml again (see
# its header).

# Images are built locally and loaded into the node, never pulled. The localhost/
# prefix is what podman gives a local image; up.sh tags docker builds the same way.
image:
  repository: localhost/ads
  tag: local
  pullPolicy: Never

# deploy/local/dependencies.yaml runs PostgreSQL with one user for every database.
database:
  url: postgresql+psycopg://ads:ads@ads-postgres:5432/ads

# Keycloak from deploy/local/keycloak.yaml. Browsers and pods use the same address.
keycloak:
  wellKnownUrl: https://keycloak.ads.local:8444/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.ads.local:8444/realms/ads
  clientId: ads
  audience: ads
  role: user

policy:
  image:
    repository: localhost/ads-policy
    tag: local
    pullPolicy: Never
  # deploy/local/dependencies.yaml runs Redis without TLS.
  redis:
    url: redis://ads-redis:6379/0
  # Short enough to watch a run expire without waiting an hour.
  runTtlSeconds: 300

audit:
  image:
    repository: localhost/ads-audit
    tag: local
    pullPolicy: Never
  rabbitmq:
    url: amqp://guest:guest@ads-rabbitmq:5672/
  postgres:
    url: postgresql+asyncpg://ads:ads@ads-postgres:5432/ads_audit
  # Low, so a few refused calls are enough to see a chat lose its tools.
  conversationBudgetLimit: 12
  blockDeliverySeconds: 30

engine:
  replicaCount: 1
  image:
    repository: localhost/ads-engine
    tag: local
    pullPolicy: Never
  # deploy/local/dependencies.yaml runs a single-node Kafka without TLS.
  kafka:
    bootstrapServers: ads-kafka:9092
  database:
    url: postgresql+psycopg://ads:ads@ads-postgres:5432/ads_engine
  keycloak:
    wellKnownUrl: https://keycloak.ads.local:8444/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.ads.local:8444/realms/ads
    audience: ads-engine
    clientId: ads
    allowedCallers:
      - ads
    ackAudience: ads
    allowedAzp: ads-engine
  workspace:
    project: ads
    repo: yet-another-solutions/ads
    env: local
  tools:
    enabled: true
    mcpAudience: ads-mcp

kafka:
  bootstrapServers: ads-kafka:9092

preferences:
  image:
    repository: localhost/ads-preferences
    tag: local
    pullPolicy: Never
  keycloak:
    wellKnownUrl: https://keycloak.ads.local:8444/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.ads.local:8444/realms/ads
    audience: ads-preferences
    clientId: ads
    allowedCallers:
      - ads
  database:
    url: postgresql+psycopg://ads:ads@ads-postgres:5432/ads_preferences

guardrail:
  enabled: true
  image:
    repository: localhost/ads-guardrail
    tag: local
    pullPolicy: Never
  personTokenAudience: ads-mcp

injectionScanner:
  enabled: true
  image:
    repository: localhost/ads-injection-scanner
    tag: local
    pullPolicy: Never

# kind has no Kata, so the probe runs only on an ordinary node: process.exec is refused
# there, which is one of the things to see.
mcpProbe:
  enabled: true
  image:
    repository: localhost/ads-mcp-probe
    tag: local
    pullPolicy: Never
  sites:
    - name: probe-container
      nodeLabels:
        ads.io/application-node: "true"

egressControlplane:
  image:
    repository: localhost/ads-egress-controlplane
    tag: local
    pullPolicy: Never

# A throwaway cluster has no Gateway API CRDs, and helm install fails outright on an
# unknown kind rather than leaving the route inert. Browsers come in through
# `kubectl port-forward svc/ads 8443:8080` and /etc/hosts, at this address.
httpRoute:
  enabled: false
  hostname: ads.local
  publicBaseUrl: https://ads.local:8443

# cert-manager signs everything with the local CA from
# deploy/local/cert-manager-issuer.yaml. The same CA is mounted into the pods so they
# verify each other and Keycloak.
tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  caBundle:
    secretName: ads-ca
    key: ca.crt

# Must match the client secrets in deploy/local/keycloak.yaml.
secrets:
  keycloakClientSecret: local-ads-client-secret
  engineKeycloakClientSecret: local-engine-client-secret
  sessionSecret: local-session-secret-32-bytes
  policyApiToken: local-policy-token-32-bytes
  auditApiToken: local-audit-token-32-bytes
  guardrailApiToken: local-guardrail-token-32-bytes
  injectionScannerApiToken: local-scanner-token-32-bytes

resources:
  requests:
    cpu: 50m
    memory: 96Mi
