replicaCount: 1

image:
  repository: ghcr.io/yet-another-solutions/ads
  tag: "0.0.1"
  pullPolicy: IfNotPresent

policy:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-policy
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  # Runs live in Redis, which the chart requires but does not install.
  redis:
    service: ads-redis
    namespace: ""
    url: rediss://ads-redis:6379/0
  runTtlSeconds: 3600
  mountPath: /policy
  mode: enforce
  denyOnPolicyError: true
  workdir: /workspace
  # How often the mounted document is re-read. The kubelet takes up to a minute to
  # publish an edited ConfigMap, so polling faster than that buys nothing.
  reloadSeconds: 10
  egressAllowlist:
    - mirror.interlab
    - llm-gateway.interlab
    - tool-broker.interlab
    - git-proxy.interlab
  protectedBranches:
    - main
    - master
    - release
  # The delivered policy. Empty means the built-in matrix compiled into the image;
  # anything here replaces it wholesale and is what the policy hash is taken over.
  # Mounted as a directory, never through subPath, so edits reach a running pod.
  document: {}

# One supervisor serves one run. Off by default: a real deployment creates these per
# run, not as a standing Deployment, and this one exists to exercise the path.
supervisor:
  enabled: false
  image:
    repository: ghcr.io/yet-another-solutions/ads-supervisor
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8083
  subject: ""
  project: ads
  repo: yet-another-solutions/ads
  env: dev
  attributes:
    - repo.write=true
    - agent=true

audit:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-audit
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8082
  prefetch: 100
  partitionsAhead: 2
  # Both are required and neither is installed by this chart.
  rabbitmq:
    service: ads-rabbitmq
    namespace: ""
    url: amqps://ads:change-me@ads-rabbitmq:5671/
  postgres:
    service: ads-postgres
    namespace: ""
    url: postgresql+asyncpg://ads:change-me@ads-postgres:5432/ads_audit

egressControlplane:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-egress-controlplane
    tag: "0.0.1"
    pullPolicy: IfNotPresent

engine:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-engine
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    requestTopic: ads.engine.request
    outputTopic: ads.engine.output
    consumerGroup: ads-engine
  database:
    url: sqlite:////tmp/ads-engine.db
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-engine
    clientId: ads
  pingIntervalSeconds: 10

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  hostname: ads.interlab
  gateway:
    name: testlab
    namespace: gateway
    sectionName: http
  backendTLS:
    caConfigMapName: testlab-ca

tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  serviceSecretName: ""
  policySecretName: ""
  auditSecretName: ""
  supervisorSecretName: ""
  caBundle:
    secretName: ""
    key: ca.crt

keycloak:
  wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.interlab/realms/ads
  clientId: ads
  audience: ads
  role: user

secrets:
  keycloakClientSecret: change-me
  sessionSecret: change-me-change-me-32b
  policyApiToken: change-me-change-me-32b
  auditApiToken: change-me-change-me-32b
  supervisorApiToken: change-me-change-me-32b

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /data
  pv:
    enabled: false
    hostPath: /storage/ads
    name: ""

nodes:
  application:
    labelKey: ads.io/application-node
    labelValue: "true"
  sandbox:
    labelKey: ads.io/sandbox-node
    labelValue: "true"
    runtimeClassName: kata-qemu

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
