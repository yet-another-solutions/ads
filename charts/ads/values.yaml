replicaCount: 1

image:
  repository: ghcr.io/yet-another-solutions/ads
  tag: "0.0.1"
  pullPolicy: IfNotPresent

policy:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-policy
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  # Runs live in Redis, which the chart requires but does not install.
  redis:
    service: ads-redis
    namespace: ""
    url: rediss://ads-redis:6379/0
  # How long a run lives with no calls into it. Each call starts the count again, so
  # a long task is kept and an abandoned one expires.
  runTtlSeconds: 3600
  mountPath: /policy
  mode: enforce
  denyOnPolicyError: true
  workdir: /workspace
  # How often the mounted document is re-read. The kubelet takes up to a minute to
  # publish an edited ConfigMap, so polling faster than that buys nothing.
  reloadSeconds: 10
  egressAllowlist:
    - mirror.interlab
    - llm-gateway.interlab
    - tool-broker.interlab
    - git-proxy.interlab
  protectedBranches:
    - main
    - master
    - release
  # The delivered policy. Empty means the built-in matrix compiled into the image;
  # anything here replaces it wholesale and is what the policy hash is taken over.
  # Mounted as a directory, never through subPath, so edits reach a running pod.
  document: {}

# One guardrail for every agent, outside all their sandboxes. It holds no run state of
# its own — runs live in the policy service — so replicas are interchangeable.
guardrail:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-guardrail
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8083
  attributes:
    - repo.write=true
    - agent=true
  # Empty accepts no person's token; configured applications still work.
  personTokenAudience: ""
  # An agent reaches each server at /mcp/<name>; bindings call it mcp:<name>.
  # `site` is where the server executes its tools; the isolation level follows from it.
  mcpServers: []
  #   - name: sandbox
  #     url: http://ads-sandbox-mcp:8080/mcp
  #     site:
  #       placement: cluster
  #       runtimeClassName: kata-clh
  #       nodeLabels:
  #         ads.io/sandbox-node: "true"
  #         ads.io/application-node: "true"
  # keySha256: printf %s "$API_SERVER_KEY" | sha256sum
  applications: []
  #   - name: hermes
  #     keySha256: "<64 lowercase hex>"
  #     workspace:
  #       project: ads
  #       repo: yet-another-solutions/ads
  #       env: test

audit:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-audit
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8082
  prefetch: 100
  partitionsAhead: 2
  # Both are required and neither is installed by this chart.
  rabbitmq:
    service: ads-rabbitmq
    namespace: ""
    url: amqps://ads:change-me@ads-rabbitmq:5671/
  postgres:
    service: ads-postgres
    namespace: ""
    url: postgresql+asyncpg://ads:change-me@ads-postgres:5432/ads_audit

egressControlplane:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-egress-controlplane
    tag: "0.0.1"
    pullPolicy: IfNotPresent

engine:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-engine
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    requestTopic: ads.engine.request
    outputTopic: ads.engine.output
    consumerGroup: ads-engine
  database:
    url: postgresql+psycopg://ads_engine:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_engine
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-engine
    clientId: ads
    allowedCallers:
      - ads
    ackAudience: ads
    allowedAzp: ads-engine
  pingIntervalSeconds: 10
  ackTimeoutSeconds: 10

# ads consumes ads.engine.output and produces ads.engine.request.
kafka:
  bootstrapServers: kafka.kafka.svc.cluster.local:9092
  requestTopic: ads.engine.request
  outputTopic: ads.engine.output
  consumerGroup: ads

preferences:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-preferences
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  baseUrl: ""
  audience: ads-preferences
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-preferences
    clientId: ads
    allowedCallers:
      - ads
  database:
    url: postgresql+psycopg://ads_preferences:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_preferences
  tls:
    serviceSecretName: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  hostname: ads.interlab
  gateway:
    name: testlab
    namespace: gateway
    sectionName: http
  backendTLS:
    caConfigMapName: testlab-ca

tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  serviceSecretName: ""
  policySecretName: ""
  auditSecretName: ""
  guardrailSecretName: ""
  caBundle:
    secretName: ""
    key: ca.crt

keycloak:
  wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.interlab/realms/ads
  clientId: ads
  audience: ads
  role: user

secrets:
  keycloakClientSecret: change-me
  sessionSecret: change-me-change-me-32b
  engineKeycloakClientSecret: change-me
  policyApiToken: change-me-change-me-32b
  auditApiToken: change-me-change-me-32b
  guardrailApiToken: change-me-change-me-32b

nodes:
  application:
    labelKey: ads.io/application-node
    labelValue: "true"
  sandbox:
    labelKey: ads.io/sandbox-node
    labelValue: "true"
    runtimeClassName: kata-qemu

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
