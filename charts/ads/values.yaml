replicaCount: 1

image:
  repository: ghcr.io/yet-another-solutions/ads
  tag: "0.0.1"
  pullPolicy: IfNotPresent

egressControlplane:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-egress-controlplane
    tag: "0.0.1"
    pullPolicy: IfNotPresent

engine:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-engine
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    requestTopic: ads.engine.request
    outputTopic: ads.engine.output
    consumerGroup: ads-engine
  database:
    url: sqlite:////tmp/ads-engine.db
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-engine
  pingIntervalSeconds: 10

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  hostname: ads.interlab
  gateway:
    name: testlab
    namespace: gateway
    sectionName: http
  backendTLS:
    caConfigMapName: testlab-ca

tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  serviceSecretName: ""
  caBundle:
    secretName: ""
    key: ca.crt

keycloak:
  wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.interlab/realms/ads
  clientId: ads
  audience: ads
  role: user

secrets:
  keycloakClientSecret: change-me
  sessionSecret: change-me-change-me-32b

persistence:
  enabled: true
  storageClass: local-path
  size: 1Gi
  accessMode: ReadWriteOnce
  mountPath: /data
  pv:
    enabled: false
    hostPath: /storage/ads
    name: ""

nodes:
  application:
    labelKey: ads.io/application-node
    labelValue: "true"
  sandbox:
    labelKey: ads.io/sandbox-node
    labelValue: "true"
    runtimeClassName: kata-clh

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
