# Workloads live here; store the Helm release in the existing default namespace.
namespace: ads
replicaCount: 1
database:
  url: postgresql+psycopg://ads:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads

image:
  repository: ghcr.io/yet-another-solutions/ads
  tag: "0.0.1"
  pullPolicy: IfNotPresent

egressControlplane:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-egress-controlplane
    tag: "0.0.1"
    pullPolicy: IfNotPresent

engine:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-engine
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    requestTopic: ads.engine.request
    outputTopic: ads.engine.output
    consumerGroup: ads-engine
  database:
    url: postgresql+psycopg://ads_engine:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_engine
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-engine
    clientId: ads
    allowedCallers:
      - ads
    ackAudience: ads
    allowedAzp: ads-engine
  pingIntervalSeconds: 10
  ackTimeoutSeconds: 10
  mcpTimeoutSeconds: 120
  maxToolCalls: 32
  recall:
    topLevel:
      reservedOutputTokens: 1024
      answerCapTokens: 1024
      completionCapTokens: null
      starvationPercentage: 10
    inner:
      reservedOutputTokens: 1024
      answerCapTokens: 1024
      completionCapTokens: null
      starvationPercentage: 10

# ads consumes ads.engine.output and produces ads.engine.request.
kafka:
  bootstrapServers: kafka.kafka.svc.cluster.local:9092
  requestTopic: ads.engine.request
  outputTopic: ads.engine.output
  consumerGroup: ads

preferences:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-preferences
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  baseUrl: ""
  audience: ads-preferences
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-preferences
    clientId: ads
    allowedCallers:
      - ads
  database:
    url: postgresql+psycopg://ads_preferences:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_preferences
  tls:
    serviceSecretName: ""

contextMeter:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-context-meter
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-context-meter
  tls:
    serviceSecretName: ""

contextCompactor:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-context-compactor
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-context-compactor
    existingSecret: ads-context-compactor-keycloak
    secretKey: client-secret
  tls:
    serviceSecretName: ""
  reservedOutputTokens: 1024
  summaryCapTokens: 2048
  completionCapTokens: 2048
  minimumReductionPercentage: 10
  starvationPercentage: 10
  recall:
    reservedOutputTokens: 1024
    answerCapTokens: 1024
    completionCapTokens: null
    starvationPercentage: 10

context:
  triggerPercentage: 80
  targetPercentage: 50

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  hostname: ads.interlab
  gateway:
    name: testlab
    namespace: gateway
    sectionName: http
  backendTLS:
    caConfigMapName: testlab-ca

tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  serviceSecretName: ""
  caBundle:
    secretName: ""
    key: ca.crt

keycloak:
  wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.interlab/realms/ads
  clientId: ads
  audience: ads
  role: user

secrets:
  keycloakClientSecret: change-me
  sessionSecret: change-me-change-me-32b
  engineKeycloakClientSecret: change-me

nodes:
  application:
    labelKey: ads.io/application-node
    labelValue: "true"
  sandbox:
    labelKey: ads.io/sandbox-node
    labelValue: "true"
    runtimeClassName: kata-qemu

# ADS owns its sandbox policy/RBAC, not the Kyverno installation.
sandbox:
  namespace: ads-sandbox
  # Session size is release metadata in files/sandbox-release.yaml, not a value.
  golden:
    slack: 2Gi
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-golden
      tag: "" # Chart.appVersion unless explicitly overridden
    resources: {}
  guest:
    # Dedicated, operator-provisioned Kata handler; see README runtime contract.
    runtimeClassName: kata-qemu-ads
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-base
      tag: ""
    resources:
      requests:
        cpu: "1"
        memory: 1536Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    # Root-owned enclosing budget; nested processes cannot raise these bounds.
    budget:
      CPU_MILLIS: 750
      MEMORY_BYTES: 805306368
      PIDS: 256
      MAX_DEPTH: 8
      MAX_DESCENDANTS: 32
  # Applied to both the golden Job and session guest.
  tolerations: []
  imagePullSecrets: [] # Names must already exist in sandbox.namespace.
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
  mcp:
    replicaCount: 1
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: PLAIN
      saslUsername: ""
      saslPassword: ""
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-mcp
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    databaseUrl: postgresql+psycopg://ads_sandbox_mcp:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_sandbox_mcp
    keycloakClientSecret: change-me
    existingSecret: "" # Env-keyed Secret; replaces the generated credentials Secret.
    tlsSecretName: "" # Required for BYO TLS.
    resources: {}
    timeoutSeconds: 120
    stdoutBytes: 65536
    stderrBytes: 65536
    inputBytes: 262144
  manager:
    replicaCount: 1
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-manager
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    databaseUrl: postgresql+psycopg://ads_sandbox_manager:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_sandbox_manager
    keycloakClientSecret: change-me
    existingSecret: ""
    tlsSecretName: ""
    resources: {}
    pollSeconds: 10
    controlSeconds: 10
    bakeSeconds: 1800
    createSeconds: 120
    readySeconds: 120
    barrierSeconds: 3
    topicReplicationFactor: 1
    idleSeconds: 1800
    detachedSeconds: 7200
    cleanupSeconds: 120
    pvcTimeoutSeconds: 120
    lifecycleBatch: 50
    pingIntervalSeconds: 10
    pingTimeoutSeconds: 30
    recoverySeconds: 600
    # Manager additionally supports Kafka TLS.
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: SCRAM-SHA-512
      saslUsername: ""
      saslPassword: ""
      caBundle:
        secretName: ""
        key: ca.crt
  ipc:
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: PLAIN
      saslUsername: ""
      saslPassword: ""
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-ipc
      tag: ""
    storageClass: local-path # Existing application-node Filesystem class.
    size: 1Gi
    keycloakClientSecret: change-me
    existingSecret: ""
    tlsSecretName: ""
    caSecretName: "" # Existing sandbox.namespace Secret with key ca.crt.
    resources: {}
    startupSeconds: 120
    timeoutSeconds: 120
    ackSeconds: 10
    pollSeconds: 0.1
    controlSeconds: 10
    stdoutBytes: 65536
    stderrBytes: 65536
    inputBytes: 262144
  admission:
    policyName: ads-sandbox-ipc-exec
    kyvernoNamespace: kyverno
    deploymentName: kyverno-admission-controller
    serviceAccountName: kyverno-admission-controller

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
