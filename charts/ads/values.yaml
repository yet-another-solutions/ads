# Workloads live here; store the Helm release in the existing default namespace.
namespace: ads
replicaCount: 1
database:
  url: postgresql+psycopg://ads:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads

image:
  repository: ghcr.io/yet-another-solutions/ads
  tag: "0.0.1"
  pullPolicy: IfNotPresent

# Sessions, projects and chat history of ads itself. The URL carries the password, so
# it is a secret and is left empty here; values-local.yaml has the local one.
database:
  url: ""

policy:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-policy
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8081
  # Runs live in Redis, which the chart requires but does not install.
  redis:
    service: ads-redis
    namespace: ""
    url: rediss://ads-redis:6379/0
  # How long a run lives with no calls into it. Each call starts the count again, so
  # a long task is kept and an abandoned one expires.
  runTtlSeconds: 3600
  mountPath: /policy
  mode: enforce
  denyOnPolicyError: true
  workdir: /workspace
  # How often the mounted document is re-read. The kubelet takes up to a minute to
  # publish an edited ConfigMap, so polling faster than that buys nothing.
  reloadSeconds: 10
  egressAllowlist:
    - mirror.interlab
    - llm-gateway.interlab
    - tool-broker.interlab
    - git-proxy.interlab
  protectedBranches:
    - main
    - master
    - release
  # The delivered policy. Empty means the built-in matrix compiled into the image;
  # anything here replaces it wholesale and is what the policy hash is taken over.
  # Mounted as a directory, never through subPath, so edits reach a running pod.
  document: {}

# One guardrail for every agent, outside all their sandboxes. It holds no run state of
# its own — runs live in the policy service — so replicas are interchangeable.
guardrail:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-guardrail
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8083
  # The confidential client the guardrail exchanges tokens with, for the audience of
  # each server behind it. Its secret is secrets.guardrailKeycloakClientSecret.
  keycloak:
    clientId: ads-guardrail
  attributes:
    - repo.write=true
    - agent=true
  # Empty accepts no person's token; configured applications still work.
  personTokenAudience: ""
  # An agent reaches each server at /mcp/<name>; bindings call it mcp:<name>.
  # `site` is where the server executes its tools; the isolation level follows from it.
  mcpServers: []
  #   - name: sandbox
  #     url: http://ads-sandbox-mcp:8080/mcp
  #     site:
  #       placement: cluster
  #       runtimeClassName: kata-clh
  #       nodeLabels:
  #         ads.io/sandbox-node: "true"
  #         ads.io/application-node: "true"
  # keySha256: printf %s "$API_SERVER_KEY" | sha256sum
  applications: []
  #   - name: hermes
  #     keySha256: "<64 lowercase hex>"
  #     workspace:
  #       project: ads
  #       repo: yet-another-solutions/ads
  #       env: test

# Reads tool results for prompt injections for the guardrail. The model is in the image.
injectionScanner:
  enabled: false
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-injection-scanner
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8085
  threshold: "0.5"
  tls:
    secretName: ""
  resources:
    requests:
      cpu: 500m
      memory: 768Mi
    limits:
      memory: 1536Mi

# A harmless MCP server for checking the whole chain. One deployment per site; each
# site is also added to the guardrail's server table as mcp:<name>, and its tools
# still need bindings in policy.document before they are allowed: policy.example.yaml
# has them for the two sites below, next to the built-in rules.
mcpProbe:
  enabled: false
  image:
    repository: ghcr.io/yet-another-solutions/ads-mcp-probe
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8084
  tls:
    secretName: ""
  resources: {}
  sites:
    - name: probe-vm
      runtimeClassName: kata-qemu
      nodeLabels:
        ads.io/sandbox-node: "true"
    - name: probe-container
      nodeLabels:
        ads.io/application-node: "true"

audit:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-audit
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8082
  prefetch: 100
  partitionsAhead: 2
  # A conversation whose weighted refusals reach this loses its tools for good.
  conversationBudgetLimit: 30
  blockDeliverySeconds: 300
  # Both are required and neither is installed by this chart.
  rabbitmq:
    service: ads-rabbitmq
    namespace: ""
    url: ""
  postgres:
    service: ads-postgres
    namespace: ""
    url: ""

egressControlplane:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-egress-controlplane
    tag: "0.0.1"
    pullPolicy: IfNotPresent

engine:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-engine
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
    requestTopic: ads.engine.request
    outputTopic: ads.engine.output
    consumerGroup: ads-engine
  database:
    url: ""
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-engine
    clientId: ads
    allowedCallers:
      - ads
    ackAudience: ads
    allowedAzp: ads-engine
  pingIntervalSeconds: 10
  ackTimeoutSeconds: 10
  mcpTimeoutSeconds: 120
  maxToolCalls: 32
  # What a run of the engine works on. The guardrail records it on the run and the
  # policy decides against it, so both tool paths need it whenever guardrail.enabled.
  workspace:
    project: ""
    repo: ""
    env: ""
    workdir: ""
  # Tool calls go through the guardrail as the person, with their token exchanged for
  # mcpAudience. Needs guardrail.enabled and tls.caBundle.secretName.
  tools:
    enabled: false
    # Empty takes the probe's sites when mcpProbe is enabled.
    mcpServers: []
    mcpAudience: ads-mcp
    maxModelRounds: 8
    callAttempts: 3

# ads consumes ads.engine.output and produces ads.engine.request.
kafka:
  bootstrapServers: kafka.kafka.svc.cluster.local:9092
  requestTopic: ads.engine.request
  outputTopic: ads.engine.output
  consumerGroup: ads

preferences:
  replicaCount: 1
  image:
    repository: ghcr.io/yet-another-solutions/ads-preferences
    tag: "0.0.1"
    pullPolicy: IfNotPresent
  service:
    port: 8080
  baseUrl: ""
  audience: ads-preferences
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
    audience: ads-preferences
    clientId: ads
    allowedCallers:
      - ads
  database:
    url: ""
  tls:
    serviceSecretName: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsUser: 1000
  runAsGroup: 1000
  runAsNonRoot: true
  allowPrivilegeEscalation: false

service:
  type: ClusterIP
  port: 8080

httpRoute:
  enabled: true
  hostname: ads.interlab
  # Where browsers reach ads, when that is not https://<hostname> — a port-forward,
  # for example. Keycloak redirects back here.
  publicBaseUrl: ""
  gateway:
    name: testlab
    namespace: gateway
    sectionName: http
  backendTLS:
    caConfigMapName: testlab-ca

tls:
  certManager:
    enabled: true
    issuer:
      name: testlab-ca
      kind: ClusterIssuer
      group: cert-manager.io
  serviceSecretName: ""
  policySecretName: ""
  auditSecretName: ""
  guardrailSecretName: ""
  caBundle:
    secretName: ""
    key: ca.crt

keycloak:
  wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
  issuer: https://keycloak.interlab/realms/ads
  clientId: ads
  audience: ads
  role: user
  # Reads another person's chat, reads the journal, lifts a block. Every reading of
  # someone else's chat is journalled.
  auditorRole: auditor

# No values here on purpose: an install that does not supply its own secrets fails
# rather than coming up with something guessable. Demo values live in
# values-local.yaml, which is for the local stand and nothing else.
secrets:
  keycloakClientSecret: ""
  sessionSecret: ""
  engineKeycloakClientSecret: ""
  policyApiToken: ""
  auditApiToken: ""
  guardrailApiToken: ""
  # Required with guardrail.enabled: the guardrail exchanges a caller's token for one
  # the server behind it accepts, so it needs its own confidential client.
  guardrailKeycloakClientSecret: ""
  injectionScannerApiToken: ""

nodes:
  application:
    labelKey: ads.io/application-node
    labelValue: "true"
  sandbox:
    labelKey: ads.io/sandbox-node
    labelValue: "true"
    runtimeClassName: kata-qemu

# ADS owns its sandbox policy/RBAC, not the Kyverno installation.
sandbox:
  namespace: ads-sandbox
  # Session size is release metadata in files/sandbox-release.yaml, not a value.
  golden:
    slack: 2Gi
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-golden
      tag: "" # Chart.appVersion unless explicitly overridden
    resources: {}
  guest:
    # Dedicated, operator-provisioned Kata handler; see README runtime contract.
    runtimeClassName: kata-qemu-ads
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-base
      tag: ""
    resources:
      requests:
        cpu: "1"
        memory: 1536Mi
      limits:
        cpu: "1"
        memory: 1536Mi
    # Root-owned enclosing budget; nested processes cannot raise these bounds.
    budget:
      CPU_MILLIS: 750
      MEMORY_BYTES: 805306368
      PIDS: 256
      MAX_DEPTH: 8
      MAX_DESCENDANTS: 32
  # Applied to both the golden Job and session guest.
  tolerations: []
  imagePullSecrets: [] # Names must already exist in sandbox.namespace.
  keycloak:
    wellKnownUrl: https://keycloak.interlab/realms/ads/.well-known/openid-configuration
    issuer: https://keycloak.interlab/realms/ads
  kafka:
    bootstrapServers: kafka.kafka.svc.cluster.local:9092
  mcp:
    replicaCount: 1
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: PLAIN
      saslUsername: ""
      saslPassword: ""
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-mcp
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    databaseUrl: postgresql+psycopg://ads_sandbox_mcp:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_sandbox_mcp
    keycloakClientSecret: change-me
    existingSecret: "" # Env-keyed Secret; replaces the generated credentials Secret.
    tlsSecretName: "" # Required for BYO TLS.
    resources: {}
    timeoutSeconds: 120
    stdoutBytes: 65536
    stderrBytes: 65536
    inputBytes: 262144
  manager:
    replicaCount: 1
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-manager
      tag: ""
      pullPolicy: IfNotPresent
    port: 8080
    databaseUrl: postgresql+psycopg://ads_sandbox_manager:change-me@postgres.ads-postgres.svc.cluster.local:5432/ads_sandbox_manager
    keycloakClientSecret: change-me
    existingSecret: ""
    tlsSecretName: ""
    resources: {}
    pollSeconds: 10
    controlSeconds: 10
    bakeSeconds: 1800
    nodeFreshSeconds: 600
    createSeconds: 120
    readySeconds: 120
    barrierSeconds: 3
    topicReplicationFactor: 1
    idleSeconds: 1800
    detachedSeconds: 7200
    cleanupSeconds: 120
    pvcTimeoutSeconds: 120
    lifecycleBatch: 50
    pingIntervalSeconds: 10
    pingTimeoutSeconds: 30
    recoverySeconds: 600
    # Manager additionally supports Kafka TLS.
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: SCRAM-SHA-512
      saslUsername: ""
      saslPassword: ""
      caBundle:
        secretName: ""
        key: ca.crt
  ipc:
    kafka:
      securityProtocol: PLAINTEXT
      saslMechanism: PLAIN
      saslUsername: ""
      saslPassword: ""
    image:
      repository: ghcr.io/yet-another-solutions/ads-sandbox-ipc
      tag: ""
    storageClass: local-path # Existing application-node Filesystem class.
    size: 1Gi
    keycloakClientSecret: change-me
    existingSecret: ""
    tlsSecretName: ""
    caSecretName: "" # Existing sandbox.namespace Secret with key ca.crt.
    resources: {}
    startupSeconds: 120
    timeoutSeconds: 120
    ackSeconds: 10
    pollSeconds: 0.1
    controlSeconds: 10
    stdoutBytes: 65536
    stderrBytes: 65536
    inputBytes: 262144
  admission:
    policyName: ads-sandbox-ipc-exec
    kyvernoNamespace: kyverno
    deploymentName: kyverno-admission-controller
    serviceAccountName: kyverno-admission-controller

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
