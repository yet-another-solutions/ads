# Standalone, create-only Keycloak Operator sample; NOT an ADS Helm template.
# See README.md before applying. No live credentials or live client UUIDs.
apiVersion: k8s.keycloak.org/v2beta1
kind: KeycloakRealmImport
metadata:
  name: ads-realm-sample
  namespace: keycloak
spec:
  keycloakCRName: keycloak
  placeholders:
    ADS_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads}
    ADS_ENGINE_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-engine}
    ADS_PREFERENCES_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-preferences}
    ADS_CONTEXT_METER_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-context-meter}
    ADS_CONTEXT_COMPACTOR_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-context-compactor}
    ADS_SANDBOX_MCP_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-sandbox-mcp}
    ADS_SANDBOX_MANAGER_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-sandbox-manager}
    ADS_SANDBOX_IPC_CLIENT_SECRET:
      secret: {name: ads-realm-client-secrets, key: ads-sandbox-ipc}
  realm:
    realm: ads
    displayName: ADS
    enabled: true
    sslRequired: all
    registrationAllowed: false
    resetPasswordAllowed: false
    rememberMe: false
    accessTokenLifespan: 300
    ssoSessionIdleTimeout: 1800
    ssoSessionMaxLifespan: 36000
    roles:
      realm:
        - name: user
          description: ADS application access; assign explicitly to authorized users.
          composite: false
    # Scope mappings allow preservation of an existing user's role. They do NOT
    # grant that role to a user or to a service account.
    scopeMappings:
      - {client: ads, roles: [user]}
      - {client: ads-engine, roles: [user]}
      - {client: ads-preferences, roles: [user]}
      - {client: ads-sandbox-mcp, roles: [user]}
      - {client: ads-sandbox-manager, roles: [user]}
      - {client: ads-sandbox-ipc, roles: [user]}
    clientScopes:
      # Keycloak 26.7.2 built-ins exported from a disposable new realm.
      # Explicit clientScopes disables automatic built-in scope creation.
      - name: basic
        description: OpenID Connect scope for add all basic claims to the token
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          display.on.consent.screen: 'false'
        protocolMappers:
        - name: auth_time
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          consentRequired: false
          config:
            user.session.note: AUTH_TIME
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: auth_time
            jsonType.label: long
        - name: sub
          protocol: openid-connect
          protocolMapper: oidc-sub-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            access.token.claim: 'true'
      - name: email
        description: 'OpenID Connect built-in scope: email'
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'true'
          consent.screen.text: ${emailScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: email
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: email
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: email
            jsonType.label: String
        - name: email verified
          protocol: openid-connect
          protocolMapper: oidc-usermodel-property-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: emailVerified
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: email_verified
            jsonType.label: boolean
      - name: profile
        description: 'OpenID Connect built-in scope: profile'
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'true'
          consent.screen.text: ${profileScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: birthdate
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: birthdate
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: birthdate
            jsonType.label: String
        - name: family name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: lastName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: family_name
            jsonType.label: String
        - name: full name
          protocol: openid-connect
          protocolMapper: oidc-full-name-mapper
          consentRequired: false
          config:
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            userinfo.token.claim: 'true'
        - name: gender
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: gender
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: gender
            jsonType.label: String
        - name: given name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: firstName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: given_name
            jsonType.label: String
        - name: locale
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: locale
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: locale
            jsonType.label: String
        - name: middle name
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: middleName
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: middle_name
            jsonType.label: String
        - name: nickname
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: nickname
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: nickname
            jsonType.label: String
        - name: picture
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: picture
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: picture
            jsonType.label: String
        - name: profile
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: profile
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: profile
            jsonType.label: String
        - name: updated at
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: updatedAt
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: updated_at
            jsonType.label: long
        - name: username
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: username
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: preferred_username
            jsonType.label: String
        - name: website
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: website
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: website
            jsonType.label: String
        - name: zoneinfo
          protocol: openid-connect
          protocolMapper: oidc-usermodel-attribute-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            userinfo.token.claim: 'true'
            user.attribute: zoneinfo
            id.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: zoneinfo
            jsonType.label: String
      - name: roles
        description: OpenID Connect scope for add user roles to the access token
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          consent.screen.text: ${rolesScopeConsentText}
          display.on.consent.screen: 'true'
        protocolMappers:
        - name: audience resolve
          protocol: openid-connect
          protocolMapper: oidc-audience-resolve-mapper
          consentRequired: false
          config:
            introspection.token.claim: 'true'
            access.token.claim: 'true'
        - name: client roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-client-role-mapper
          consentRequired: false
          config:
            user.attribute: foo
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: resource_access.${client_id}.roles
            jsonType.label: String
            multivalued: 'true'
        - name: realm roles
          protocol: openid-connect
          protocolMapper: oidc-usermodel-realm-role-mapper
          consentRequired: false
          config:
            user.attribute: foo
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: realm_access.roles
            jsonType.label: String
            multivalued: 'true'
      - name: service_account
        description: Specific scope for a client enabled for service accounts
        protocol: openid-connect
        attributes:
          include.in.token.scope: 'false'
          display.on.consent.screen: 'false'
        protocolMappers:
        - name: Client Host
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          consentRequired: false
          config:
            user.session.note: clientHost
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: clientHost
            jsonType.label: String
        - name: Client ID
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          consentRequired: false
          config:
            user.session.note: client_id
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: client_id
            jsonType.label: String
        - name: Client IP Address
          protocol: openid-connect
          protocolMapper: oidc-usersessionmodel-note-mapper
          consentRequired: false
          config:
            user.session.note: clientAddress
            id.token.claim: 'true'
            introspection.token.claim: 'true'
            access.token.claim: 'true'
            claim.name: clientAddress
            jsonType.label: String
      # Only explicitly requested by the access-only engine acknowledgement STE.
      # Never request this scope for the MCP pair or its refresh grant.
      - name: ads-engine-ack
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: audience-ads
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads
              access.token.claim: "true"
              id.token.claim: "false"
      # Access-only meter STE explicitly requests this; never include on MCP refresh.
      - name: ads-engine-context-meter
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: audience-ads-context-meter
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-context-meter
              access.token.claim: "true"
              id.token.claim: "false"
      - name: ads-engine-context-compactor
        protocol: openid-connect
        attributes:
          include.in.token.scope: "true"
        protocolMappers:
          - name: audience-ads-context-compactor
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-context-compactor
              access.token.claim: "true"
              id.token.claim: "false"
    # Built-in definitions above are explicit because this import also declares
    # a custom optional scope. No client receives offline_access.
    clients:
      - clientId: ads
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: true
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        consentRequired: false
        rootUrl: https://ads.example.com
        baseUrl: https://ads.example.com
        redirectUris: [https://ads.example.com/auth/callback]
        webOrigins: [https://ads.example.com]
        defaultClientScopes: [basic, roles, profile, email, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "true"
          access.token.lifespan: "300"
          post.logout.redirect.uris: https://ads.example.com/
        protocolMappers:
          - name: audience-ads
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads
              access.token.claim: "true"
              id.token.claim: "true"
          - name: audience-ads-engine
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-engine
              access.token.claim: "true"
              id.token.claim: "false"
          - name: audience-ads-preferences
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-preferences
              access.token.claim: "true"
              id.token.claim: "false"
      - clientId: ads-engine
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_ENGINE_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        # No built-in roles scope: its audience resolver/client-role mapper can
        # widen a refreshed token. Only the scoped realm role mapper below.
        # Keycloak automatically attaches service_account for enabled service
        # accounts; its session-note mappers add metadata, not roles/audiences.
        defaultClientScopes: [basic, service_account]
        optionalClientScopes: [ads-engine-ack, ads-engine-context-meter, ads-engine-context-compactor]
        attributes:
          standard.token.exchange.enabled: "true"
          standard.token.exchange.enableRefreshRequestedTokenType: SAME_SESSION
          access.token.lifespan: "300"
        protocolMappers:
          - name: scoped-user-role
            protocol: openid-connect
            protocolMapper: oidc-usermodel-realm-role-mapper
            config:
              claim.name: realm_access.roles
              jsonType.label: String
              multivalued: "true"
              access.token.claim: "true"
              id.token.claim: "false"
          - name: audience-ads-sandbox-mcp
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - clientId: ads-context-compactor
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_CONTEXT_COMPACTOR_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "true"
          access.token.lifespan: "300"
        protocolMappers:
          - name: audience-ads-context-meter
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-context-meter
              access.token.claim: "true"
              id.token.claim: "false"
      - clientId: ads-context-meter
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_CONTEXT_METER_CLIENT_SECRET}
        serviceAccountsEnabled: false
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "false"
          access.token.lifespan: "300"
        protocolMappers: []
      - clientId: ads-preferences
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_PREFERENCES_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic, roles, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "false"
          access.token.lifespan: "300"
        protocolMappers:
          - name: audience-ads-preferences
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-preferences
              access.token.claim: "true"
              id.token.claim: "false"
      - clientId: ads-sandbox-mcp
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_SANDBOX_MCP_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic, roles, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "true"
          access.token.lifespan: "300"
        protocolMappers:
          - name: audience-ads-sandbox-manager
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-manager
              access.token.claim: "true"
              id.token.claim: "false"
      - id: 10000000-0000-4000-8000-000000000005
        clientId: ads-sandbox-manager
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_SANDBOX_MANAGER_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic, roles, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "true"
          access.token.lifespan: "300"
        protocolMappers:
          - name: audience-ads-sandbox-manager
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-manager
              access.token.claim: "true"
              id.token.claim: "false"
          - name: audience-ads-sandbox-ipc
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-ipc
              access.token.claim: "true"
              id.token.claim: "false"
          - name: audience-ads-sandbox-mcp
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-mcp
              access.token.claim: "true"
              id.token.claim: "false"
      - id: 10000000-0000-4000-8000-000000000006
        clientId: ads-sandbox-ipc
        protocol: openid-connect
        enabled: true
        publicClient: false
        clientAuthenticatorType: client-secret
        secret: ${ADS_SANDBOX_IPC_CLIENT_SECRET}
        serviceAccountsEnabled: true
        standardFlowEnabled: false
        implicitFlowEnabled: false
        directAccessGrantsEnabled: false
        fullScopeAllowed: false
        defaultClientScopes: [basic, roles, service_account]
        optionalClientScopes: []
        attributes:
          standard.token.exchange.enabled: "true"
          access.token.lifespan: "300"
        protocolMappers:
          - name: audience-ads-sandbox-manager
            protocol: openid-connect
            protocolMapper: oidc-audience-mapper
            config:
              included.client.audience: ads-sandbox-manager
              access.token.claim: "true"
              id.token.claim: "false"
    # These are service-account records only, not human login/test users.
    # Preserve native service-account user subjects; never map client IDs to sub.
    users:
      - username: service-account-ads-sandbox-manager
        enabled: true
        serviceAccountClientId: ads-sandbox-manager
      - username: service-account-ads-sandbox-ipc
        enabled: true
        serviceAccountClientId: ads-sandbox-ipc
    components:
      org.keycloak.userprofile.UserProfileProvider:
        - providerId: declarative-user-profile
          config:
            kc.user.profile.config:
              - |
                {
                  "attributes": [
                    {
                      "name": "username",
                      "validations": {"length": {"min": 3, "max": 255}, "username-prohibited-characters": {}, "up-username-not-idn-homograph": {}},
                      "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]},
                      "multivalued": false
                    },
                    {
                      "name": "email",
                      "validations": {"email": {}, "length": {"max": 255}},
                      "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]},
                      "multivalued": false
                    },
                    {
                      "name": "firstName",
                      "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                      "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]},
                      "multivalued": false
                    },
                    {
                      "name": "lastName",
                      "validations": {"length": {"max": 255}, "person-name-prohibited-characters": {}},
                      "permissions": {"view": ["admin", "user"], "edit": ["admin", "user"]},
                      "multivalued": false
                    },
                    {
                      "name": "ads_service_client_uuid",
                      "permissions": {"view": ["admin"], "edit": ["admin"]},
                      "multivalued": false
                    }
                  ]
                }
