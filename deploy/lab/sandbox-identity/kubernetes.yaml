apiVersion: v1
kind: Namespace
metadata:
  name: ads-sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ads-sandbox-manager
  namespace: ads
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ads-sandbox-ipc
  namespace: ads-sandbox
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-manager
  namespace: ads-sandbox
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-manager
  namespace: ads-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-manager
subjects:
  - kind: ServiceAccount
    name: ads-sandbox-manager
    namespace: ads
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-ipc
  namespace: ads-sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-ipc
  namespace: ads-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-ipc
subjects:
  - kind: ServiceAccount
    name: ads-sandbox-ipc
    namespace: ads-sandbox
---
# The policy needs only live Pod reads in this namespace, not cluster-wide view.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ads-sandbox-admission
  namespace: ads-sandbox
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ads-sandbox-admission
  namespace: ads-sandbox
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ads-sandbox-admission
subjects:
  - kind: ServiceAccount
    name: kyverno-admission-controller
    namespace: kyverno
