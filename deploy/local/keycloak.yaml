# Keycloak for the local stand: realm "ads" with every client the chain uses and one
# user. Browsers and pods reach it at the same address, https://keycloak.ads.local:8444,
# so the issuer in a token is the same wherever it is checked: browsers through
# /etc/hosts and a port-forward, pods through a CoreDNS rewrite to this Service.
#
#
# Dev mode, no persistence: the realm is imported again on every start.
#
# The client scopes are listed in full because the engine asks for its audiences by
# scope name (ads-engine-ack, -context-meter, -context-compactor, -sandbox-mcp,
# -guardrail), and a realm import that names any client scope gets no built-in ones:
# basic, roles and profile are copied as Keycloak creates them, or tokens lose sub and
# roles. The engine carries no audience mapper of its own: a refresh would bring every
# one of them back into the credential, and the engine refuses a widened audience.
#
#   kubectl apply -n ads -f deploy/local/keycloak.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: testlab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - keycloak.ads.local
    - keycloak
    - keycloak.ads.svc
    - keycloak.ads.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  ads-realm.json: |
    {
      "realm": "ads",
      "enabled": true,
      "sslRequired": "external",
      "accessTokenLifespan": 300,
      "passwordPolicy": "hashAlgorithm(pbkdf2-sha512)",
      "roles": {"realm": [{"name": "user"}, {"name": "auditor"}]},
      "scopeMappings": [{"client": "ads-engine", "roles": ["user"]}],
      "clientScopes": [
        {"name": "basic", "description": "OpenID Connect scope for add all basic claims to the token", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "false", "display.on.consent.screen": "false"},
         "protocolMappers": [
           {"name": "auth_time", "protocol": "openid-connect", "protocolMapper": "oidc-usersessionmodel-note-mapper", "consentRequired": false, "config": {"user.session.note": "AUTH_TIME", "id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "auth_time", "jsonType.label": "long"}},
           {"name": "sub", "protocol": "openid-connect", "protocolMapper": "oidc-sub-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "access.token.claim": "true"}}
         ]},
        {"name": "acr", "description": "OpenID Connect scope for add acr (authentication context class reference) to the token", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "false", "display.on.consent.screen": "false"},
         "protocolMappers": [
           {"name": "acr loa level", "protocol": "openid-connect", "protocolMapper": "oidc-acr-mapper", "consentRequired": false, "config": {"id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true"}}
         ]},
        {"name": "email", "description": "OpenID Connect built-in scope: email", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true", "consent.screen.text": "${emailScopeConsentText}", "display.on.consent.screen": "true"},
         "protocolMappers": [
           {"name": "email verified", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-property-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "emailVerified", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "email_verified", "jsonType.label": "boolean"}},
           {"name": "email", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "email", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "email", "jsonType.label": "String"}}
         ]},
        {"name": "profile", "description": "OpenID Connect built-in scope: profile", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true", "consent.screen.text": "${profileScopeConsentText}", "display.on.consent.screen": "true"},
         "protocolMappers": [
           {"name": "updated at", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "updatedAt", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "updated_at", "jsonType.label": "long"}},
           {"name": "given name", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "firstName", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "given_name", "jsonType.label": "String"}},
           {"name": "birthdate", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "birthdate", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "birthdate", "jsonType.label": "String"}},
           {"name": "gender", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "gender", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "gender", "jsonType.label": "String"}},
           {"name": "zoneinfo", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "zoneinfo", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "zoneinfo", "jsonType.label": "String"}},
           {"name": "picture", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "picture", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "picture", "jsonType.label": "String"}},
           {"name": "locale", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "locale", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "locale", "jsonType.label": "String"}},
           {"name": "website", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "website", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "website", "jsonType.label": "String"}},
           {"name": "nickname", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "nickname", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "nickname", "jsonType.label": "String"}},
           {"name": "middle name", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "middleName", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "middle_name", "jsonType.label": "String"}},
           {"name": "profile", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "profile", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "profile", "jsonType.label": "String"}},
           {"name": "family name", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "lastName", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "family_name", "jsonType.label": "String"}},
           {"name": "full name", "protocol": "openid-connect", "protocolMapper": "oidc-full-name-mapper", "consentRequired": false, "config": {"id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true", "userinfo.token.claim": "true"}},
           {"name": "username", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-attribute-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "userinfo.token.claim": "true", "user.attribute": "username", "id.token.claim": "true", "access.token.claim": "true", "claim.name": "preferred_username", "jsonType.label": "String"}}
         ]},
        {"name": "roles", "description": "OpenID Connect scope for add user roles to the access token", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "false", "consent.screen.text": "${rolesScopeConsentText}", "display.on.consent.screen": "true"},
         "protocolMappers": [
           {"name": "client roles", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-client-role-mapper", "consentRequired": false, "config": {"user.attribute": "foo", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "resource_access.${client_id}.roles", "jsonType.label": "String", "multivalued": "true"}},
           {"name": "audience resolve", "protocol": "openid-connect", "protocolMapper": "oidc-audience-resolve-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "access.token.claim": "true"}},
           {"name": "realm roles", "protocol": "openid-connect", "protocolMapper": "oidc-usermodel-realm-role-mapper", "consentRequired": false, "config": {"user.attribute": "foo", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "realm_access.roles", "jsonType.label": "String", "multivalued": "true"}}
         ]},
        {"name": "web-origins", "description": "OpenID Connect scope for add allowed web origins to the access token", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "false", "consent.screen.text": "", "display.on.consent.screen": "false"},
         "protocolMappers": [
           {"name": "allowed web origins", "protocol": "openid-connect", "protocolMapper": "oidc-allowed-origins-mapper", "consentRequired": false, "config": {"introspection.token.claim": "true", "access.token.claim": "true"}}
         ]},
        {"name": "service_account", "description": "Specific scope for a client enabled for service accounts", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "false", "display.on.consent.screen": "false"},
         "protocolMappers": [
           {"name": "Client IP Address", "protocol": "openid-connect", "protocolMapper": "oidc-usersessionmodel-note-mapper", "consentRequired": false, "config": {"user.session.note": "clientAddress", "id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "clientAddress", "jsonType.label": "String"}},
           {"name": "Client Host", "protocol": "openid-connect", "protocolMapper": "oidc-usersessionmodel-note-mapper", "consentRequired": false, "config": {"user.session.note": "clientHost", "id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "clientHost", "jsonType.label": "String"}},
           {"name": "Client ID", "protocol": "openid-connect", "protocolMapper": "oidc-usersessionmodel-note-mapper", "consentRequired": false, "config": {"user.session.note": "client_id", "id.token.claim": "true", "introspection.token.claim": "true", "access.token.claim": "true", "claim.name": "client_id", "jsonType.label": "String"}}
         ]},
        {"name": "ads-engine-ack", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]},
        {"name": "ads-engine-context-meter", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads-context-meter", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads-context-meter", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]},
        {"name": "ads-engine-context-compactor", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads-context-compactor", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads-context-compactor", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]},
        {"name": "ads-engine-sandbox-mcp", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads-sandbox-mcp", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads-sandbox-mcp", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]},
        {"name": "ads-engine-guardrail", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads-guardrail", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads-guardrail", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]},
        {"name": "ads-audit-ads", "protocol": "openid-connect",
         "attributes": {"include.in.token.scope": "true"},
         "protocolMappers": [
           {"name": "audience-ads", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper", "config": {"included.client.audience": "ads", "access.token.claim": "true", "id.token.claim": "false", "introspection.token.claim": "true"}}
         ]}
      ],
      "defaultDefaultClientScopes": ["basic", "acr", "email", "profile", "roles", "web-origins"],
      "defaultOptionalClientScopes": [],
      "clients": [
        {
          "clientId": "ads",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-ads-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["https://ads.local:8443/*"],
          "webOrigins": ["https://ads.local:8443"],
          "attributes": {
            "standard.token.exchange.enabled": "true",
            "post.logout.redirect.uris": "https://ads.local:8443/*"
          },
          "protocolMappers": [
            {
              "name": "audience-ads", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            },
            {
              "name": "audience-ads-engine", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-engine", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            },
            {
              "name": "audience-ads-preferences", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-preferences", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-audit",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-audit-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["https://audit.ads.local:8445/*"],
          "webOrigins": ["https://audit.ads.local:8445"],
          "attributes": {"standard.token.exchange.enabled": "true",
                         "post.logout.redirect.uris": "https://audit.ads.local:8445/*"},
          "optionalClientScopes": ["ads-audit-ads"],
          "protocolMappers": [
            {
              "name": "audience-ads-audit", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-audit", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-engine",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-engine-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "fullScopeAllowed": false,
          "attributes": {"standard.token.exchange.enabled": "true",
                         "standard.token.exchange.enableRefreshRequestedTokenType": "SAME_SESSION"},
          "defaultClientScopes": ["basic"],
          "optionalClientScopes": ["ads-engine-ack", "ads-engine-context-meter", "ads-engine-context-compactor",
                                   "ads-engine-sandbox-mcp", "ads-engine-guardrail"],
          "protocolMappers": [
            {
              "name": "scoped-user-role", "protocol": "openid-connect",
              "protocolMapper": "oidc-usermodel-realm-role-mapper",
              "config": {"claim.name": "realm_access.roles", "jsonType.label": "String", "multivalued": "true",
                         "access.token.claim": "true", "id.token.claim": "false"}
            }
          ]
        },
        {
          "clientId": "ads-preferences",
          "enabled": true,
          "publicClient": false,
          "secret": "local-preferences-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-mcp",
          "enabled": true,
          "publicClient": false,
          "secret": "local-mcp-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-guardrail",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-guardrail-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "fullScopeAllowed": false,
          "defaultClientScopes": ["basic"],
          "attributes": {"standard.token.exchange.enabled": "true"},
          "protocolMappers": [
            {
              "name": "audience-ads-sandbox-mcp", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-sandbox-mcp", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-context-meter",
          "enabled": true,
          "publicClient": false,
          "secret": "local-context-meter-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-context-compactor",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-context-compactor-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {"standard.token.exchange.enabled": "true"},
          "protocolMappers": [
            {
              "name": "audience-ads-context-meter", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-context-meter", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-sandbox-mcp",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-mcp-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-sandbox-manager",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-manager-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-sandbox-ipc",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-ipc-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@ads.local",
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Local",
          "credentials": [{"type": "password", "value": "alice", "temporary": false}],
          "realmRoles": ["default-roles-ads", "user"]
        },
        {
          "username": "audrey",
          "enabled": true,
          "email": "audrey@ads.local",
          "emailVerified": true,
          "firstName": "Audrey",
          "lastName": "Auditor",
          "credentials": [{"type": "password", "value": "audrey", "temporary": false}],
          "realmRoles": ["default-roles-ads", "auditor"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          args:
            - start-dev
            - --import-realm
            - --bootstrap-admin-username=admin
            - --bootstrap-admin-password=admin
            - --https-port=8443
            - --https-certificate-file=/tls/tls.crt
            - --https-certificate-key-file=/tls/tls.key
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME
              value: https://keycloak.ads.local:8444
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: keycloak-tls
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8444
      targetPort: https
