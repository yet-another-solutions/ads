# Keycloak for the local stand: realm "ads" with every client the chain uses and one
# user. Browsers and pods reach it at the same address, https://keycloak.ads.local:8444,
# so the issuer in a token is the same wherever it is checked: browsers through
# /etc/hosts and a port-forward, pods through a CoreDNS rewrite to this Service.
#
#
# Dev mode, no persistence: the realm is imported again on every start.
#
#   kubectl apply -n ads -f deploy/local/keycloak.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
spec:
  secretName: keycloak-tls
  issuerRef:
    name: testlab-ca
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - keycloak.ads.local
    - keycloak
    - keycloak.ads.svc
    - keycloak.ads.svc.cluster.local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  ads-realm.json: |
    {
      "realm": "ads",
      "enabled": true,
      "sslRequired": "external",
      "accessTokenLifespan": 300,
      "passwordPolicy": "hashAlgorithm(pbkdf2-sha512)",
      "roles": {"realm": [{"name": "user"}]},
      "clients": [
        {
          "clientId": "ads",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-ads-client-secret",
          "standardFlowEnabled": true,
          "directAccessGrantsEnabled": false,
          "redirectUris": ["https://ads.local:8443/*"],
          "webOrigins": ["https://ads.local:8443"],
          "attributes": {
            "standard.token.exchange.enabled": "true",
            "post.logout.redirect.uris": "https://ads.local:8443/*"
          },
          "protocolMappers": [
            {
              "name": "audience-ads", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            },
            {
              "name": "audience-ads-engine", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-engine", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            },
            {
              "name": "audience-ads-preferences", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-preferences", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-engine",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-engine-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {"standard.token.exchange.enabled": "true"},
          "protocolMappers": [
            {
              "name": "audience-ads", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            },
            {
              "name": "audience-ads-mcp", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-mcp", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-preferences",
          "enabled": true,
          "publicClient": false,
          "secret": "local-preferences-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-mcp",
          "enabled": true,
          "publicClient": false,
          "secret": "local-mcp-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-guardrail",
          "enabled": true,
          "publicClient": false,
          "clientAuthenticatorType": "client-secret",
          "secret": "local-guardrail-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false,
          "serviceAccountsEnabled": false,
          "attributes": {"standard.token.exchange.enabled": "true"},
          "protocolMappers": [
            {
              "name": "audience-ads-sandbox-mcp", "protocol": "openid-connect",
              "protocolMapper": "oidc-audience-mapper",
              "config": {"included.client.audience": "ads-sandbox-mcp", "access.token.claim": "true",
                         "id.token.claim": "false", "introspection.token.claim": "true"}
            }
          ]
        },
        {
          "clientId": "ads-sandbox-mcp",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-mcp-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-sandbox-manager",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-manager-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        },
        {
          "clientId": "ads-sandbox-ipc",
          "enabled": true,
          "publicClient": false,
          "secret": "local-sandbox-ipc-client-secret",
          "standardFlowEnabled": false,
          "directAccessGrantsEnabled": false
        }
      ],
      "users": [
        {
          "username": "alice",
          "enabled": true,
          "email": "alice@ads.local",
          "emailVerified": true,
          "firstName": "Alice",
          "lastName": "Local",
          "credentials": [{"type": "password", "value": "alice", "temporary": false}],
          "realmRoles": ["default-roles-ads", "user"]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.7.2
          args:
            - start-dev
            - --import-realm
            - --bootstrap-admin-username=admin
            - --bootstrap-admin-password=admin
            - --https-port=8443
            - --https-certificate-file=/tls/tls.crt
            - --https-certificate-key-file=/tls/tls.key
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: admin
            - name: KC_HOSTNAME
              value: https://keycloak.ads.local:8444
            - name: KC_HTTP_ENABLED
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - name: https
              containerPort: 8443
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: keycloak-tls
        - name: realm
          configMap:
            name: keycloak-realm
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: https
      port: 8444
      targetPort: https
