#     --set egressControlplane.image.repository=localhost/ads-egress-controlplane \
#     > deploy/local/rendered.yaml
#
# Apply after steps 2 to 4 of the README — the node label, cert-manager with the
# local CA, and the dependencies. The prerequisite checks the chart runs on install
# are skipped here, because `helm template` cannot look anything up, so nothing
# stops an apply against a cluster that is not ready; the pods just never start.
#
#   kubectl apply -n ads -f deploy/local/rendered.yaml
#
# The Certificates sit at the end of the file and the Deployments that mount their
# secrets come earlier. That is fine: those pods stay in ContainerCreating until
# cert-manager issues them, and start on their own afterwards.
#
# There is no helm release behind this, so `helm upgrade` and `helm uninstall` do
