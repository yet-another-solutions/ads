apiVersion: apps/v1
kind: Deployment
metadata:
  name: ads-audit
  labels:
    helm.sh/chart: ads-0.0.2
    app.kubernetes.io/name: ads
    app.kubernetes.io/instance: ads
    app.kubernetes.io/version: "0.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: ads-audit
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ads
      app.kubernetes.io/instance: ads
      app.kubernetes.io/component: ads-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ads
        app.kubernetes.io/instance: ads
        app.kubernetes.io/component: ads-audit
    spec:
      serviceAccountName: ads
      securityContext:
        fsGroup: 1000
      containers:
        - name: ads-audit
          securityContext:
            allowPrivilegeEscalation: false
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          image: "localhost/ads-audit:local"
          imagePullPolicy: Never
          ports:
            - name: https
              containerPort: 8082
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ads-audit
            - secretRef:
                name: ads-audit
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
            - name: ca
              mountPath: /ca
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: https
              scheme: HTTPS
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
      volumes:
        - name: tls
          secret:
            secretName: ads-audit-tls
        - name: ca
          secret:
            secretName: ads-ca
            items:
              - key: ca.crt
                path: ca.crt
      nodeSelector:
        ads.io/application-node: "true"
