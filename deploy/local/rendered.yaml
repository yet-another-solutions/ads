data:
  policy.yaml: |
    bindings:
    - argument: command
      capability: process.exec
      source: opencode
      tool: bash
    - argument: filePath
      capability: fs.read
      source: opencode
      tool: read
    - argument: filePath
      capability: fs.write
      source: opencode
      tool: write
    - argument: filePath
      capability: fs.write
      source: opencode
      tool: edit
    - argument: path
      capability: fs.read
      source: opencode
      tool: grep
    - argument: path
      capability: fs.read
      source: opencode
      tool: glob
    - argument: path
      capability: fs.read
      source: opencode
      tool: list
    - argument: url
      capability: net.egress
      source: opencode
      tool: webfetch
    - capability: net.egress
      source: opencode
      tool: websearch
      value: search-proxy.interlab
    - capability: fs.read
      source: mcp:probe-vm
      tool: echo
      value: /workspace/notes.md
    - capability: fs.read
      source: mcp:probe-vm
      tool: env_config
      value: /workspace/.env.example
    - capability: fs.read
      source: mcp:probe-vm
      tool: release_notes
      value: /workspace/NOTES.md
    - capability: fs.read
      source: mcp:probe-vm
      tool: tail_log
      value: /workspace/notes.md
    - argument: path
      capability: fs.read
      source: mcp:probe-vm
      tool: read_file
    - argument: command
      capability: process.exec
      source: mcp:probe-vm
      tool: run_command
    - capability: fs.read
      source: mcp:probe-container
      tool: echo
      value: /workspace/notes.md
    - capability: fs.read
      source: mcp:probe-container
      tool: env_config
      value: /workspace/.env.example
    - capability: fs.read
      source: mcp:probe-container
      tool: release_notes
      value: /workspace/NOTES.md
    - capability: fs.read
      source: mcp:probe-container
      tool: tail_log
      value: /workspace/notes.md
    - argument: path
      capability: fs.read
      source: mcp:probe-container
      tool: read_file
    - argument: command
      capability: process.exec
      source: mcp:probe-container
      tool: run_command
    capabilities:
    - capability: fs.read
      classifier:
        kind: path
        match: workdir
        otherwise: outside-workdir
    - capability: fs.write
      classifier:
        kind: path
        match: workdir
        otherwise: outside-workdir
    - capability: process.exec
      classifier:
        kind: literal
        match: any
    - capability: net.egress
      classifier:
        kind: host
        match: allowlist
        otherwise: internet
    - capability: db.query
      classifier:
        kind: literal
        match: broker
    - capability: db.migrate
      classifier:
        kind: suffix
        match: temporary
        otherwise: outside-workdir
        value: .sql
    - capability: secret.read
      classifier:
        kind: literal
        match: any
    - capability: vcs.push
      classifier:
        kind: branch
        match: protected-branch
        otherwise: feature-branch
    defaultWeight: 1
    denyOnPolicyError: true
    egressAllowlist:
    - mirror.interlab
    - llm-gateway.interlab
    - tool-broker.interlab
    - git-proxy.interlab
    interception:
      prompt:
        checks:
        - secrets
        - injection
        review:
        - injection
        "true": enforce
      request:
        checks:
        - secrets
        "true": enforce
      response:
        checks:
        - secrets
        - injection
        review:
        - injection
        "true": enforce
    mode: enforce
    protectedBranches:
    - main
    - master
    - release
    rules:
    - capability: fs.read
      id: fs.read.workdir
      levels:
      - local
      - container
      - vm
      resourceClass: workdir
    - capability: fs.write
      id: fs.write.workdir
      levels:
      - local
      - container
      - vm
      resourceClass: workdir
    - capability: fs.read
      id: fs.read.outside
      levels: []
      resourceClass: outside-workdir
      weight: 3
    - capability: fs.write
      id: fs.write.outside
      levels: []
      resourceClass: outside-workdir
      weight: 3
    - capability: process.exec
      id: process.exec
      levels:
      - local
      - vm
      resourceClass: any
      weight: 2
    - capability: net.egress
      id: net.egress.internet
      levels:
      - local
      resourceClass: internet
      weight: 2
    - capability: net.egress
      id: net.egress.allowlist
      levels:
      - local
      - container
      - vm
      resourceClass: allowlist
    - capability: db.query
      id: db.query.broker
      levels:
      - local
      - container
      - vm
      resourceClass: broker
    - alternative: db.query
      capability: db.migrate
      id: db.migrate.temporary
      levels:
      - vm
      resourceClass: temporary
      weight: 2
    - alternative: db.query
      capability: db.migrate
      id: db.migrate.outside
      levels: []
      resourceClass: outside-workdir
      weight: 4
    - capability: secret.read
      id: secret.read
      levels: []
      resourceClass: any
      weight: 5
    - capability: vcs.push
      id: vcs.push.feature
      levels:
      - local
      - vm
      requires:
        repo.write: "true"
      resourceClass: feature-branch
      weight: 2
    - alternative: vcs.push to a feature branch
      capability: vcs.push
      id: vcs.push.protected
      levels: []
      resourceClass: protected-branch
      weight: 5
