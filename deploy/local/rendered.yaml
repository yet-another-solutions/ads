# Source: ads/templates/sandbox-exec-policy.yaml
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
  labels:
    app.kubernetes.io/instance: ads
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ads
    app.kubernetes.io/version: 0.0.1
    helm.sh/chart: ads-0.0.2
  name: ads-sandbox-ipc-exec
spec:
  admission: true
  background: false
  failurePolicy: Fail
  rules:
  - match:
      any:
      - resources:
          kinds:
          - Pod/exec
          namespaces:
          - ads-sandbox
          operations:
          - CONNECT
        subjects:
        - kind: ServiceAccount
          name: ads-sandbox-ipc
          namespace: ads-sandbox
    name: require-bound-pod-identity
    validate:
      deny:
        conditions:
          any:
          - key: '{{ request.userInfo.extra."authentication.kubernetes.io/pod-name"[0]
              || `""` }}'
            operator: Equals
            value: ""
          - key: '{{ request.userInfo.extra."authentication.kubernetes.io/pod-uid"[0]
              || `""` }}'
            operator: Equals
            value: ""
          - key: '{{ request.object.container || `""` }}'
            operator: NotEquals
            value: sandbox
      message: IPC exec requires a pod-bound identity and the sandbox container.
  - context:
    - apiCall:
        urlPath: /api/v1/namespaces/ads-sandbox/pods/{{ request.userInfo.extra."authentication.kubernetes.io/pod-name"[0]
          || `"missing-bound-pod"` }}
      name: caller
    - apiCall:
        urlPath: /api/v1/namespaces/{{ request.namespace }}/pods/{{ request.name }}
      name: target
    match:
      any:
      - resources:
          kinds:
          - Pod/exec
          namespaces:
          - ads-sandbox
          operations:
          - CONNECT
        subjects:
        - kind: ServiceAccount
          name: ads-sandbox-ipc
          namespace: ads-sandbox
    name: same-sandbox-only
    validate:
      deny:
        conditions:
          any:
          - key: '{{ caller.metadata.uid }}'
            operator: NotEquals
            value: '{{ request.userInfo.extra."authentication.kubernetes.io/pod-uid"[0]
              || `""` }}'
          - key: '{{ caller.spec.serviceAccountName }}'
            operator: NotEquals
            value: ads-sandbox-ipc
          - key: '{{ caller.metadata.labels."ads.io/sandbox-id" || `""` }}'
            operator: Equals
            value: ""
          - key: '{{ target.metadata.labels."ads.io/sandbox-id" || `""` }}'
            operator: NotEquals
            value: '{{ caller.metadata.labels."ads.io/sandbox-id" || `""` }}'
          - key: '{{ target.metadata.uid }}'
            operator: Equals
            value: '{{ caller.metadata.uid }}'
          - key: '{{ target.spec.serviceAccountName || `"default"` }}'
            operator: Equals
            value: ads-sandbox-ipc
          - key: '{{ target.spec.containers[].name }}'
            operator: AllNotIn
            value:
            - sandbox
      message: 'IPC exec denied: caller and guest must have the same nonempty sandbox-id.'
  validationFailureAction: Enforce
  webhookTimeoutSeconds: 10
