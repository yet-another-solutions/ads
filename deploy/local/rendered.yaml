#
# The chart already rendered, for a machine that has kubectl but no helm. Image
# names carry the localhost/ prefix that podman gives a locally built image, so
# this file suits podman and not docker.
#
# Regenerate with:
#
#   helm template ads charts/ads -n ads -f charts/ads/values-local.yaml \
#     --set image.repository=localhost/ads \
#     --set policy.image.repository=localhost/ads-policy \
#     --set audit.image.repository=localhost/ads-audit \
