[project]
name = "ads-commons-schema"
version = "0.0.1"
description = "ADS shared Alembic upgrade and schema validation"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "alembic==1.16.5",
    "sqlalchemy==2.0.43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_commons_schema"]

[tool.deptry]
known_first_party = ["ads_commons_schema"]
