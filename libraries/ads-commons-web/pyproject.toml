[project]
name = "ads-commons-web"
version = "0.0.1"
description = "ADS shared browser login, sessions and look"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "authlib==1.8.0",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "litestar==2.24.0",
    "stamina==26.1.0",
    "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_commons_web"]

[tool.deptry]
known_first_party = ["ads_commons_web"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
