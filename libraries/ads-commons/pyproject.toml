[project]
name = "ads-commons"
version = "0.0.1"
description = "ADS shared DTOs and common system logic"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "msgspec==0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_commons"]

[tool.deptry]
known_first_party = ["ads_commons"]
