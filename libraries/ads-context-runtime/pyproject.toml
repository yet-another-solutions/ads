[project]
name = "ads-context-runtime"
version = "0.0.1"
description = "Shared local ADS recall frame guards and LangChain adapter"
requires-python = ">=3.12"
dependencies = [
    "ads-commons",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langgraph==1.0.5",
    "langsmith==0.12.4",
    "httpx2==2.12.0",
    "msgspec==0.21.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/ads_context_runtime"]
[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
