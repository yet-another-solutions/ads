[project]
name = "ads-workspace"
version = "0.0.1"
description = "Autonomous Development System workspace"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads",
    "ads-audit",
    "ads-commons",
    "ads-commons-beans",
    "ads-commons-schema",
    "ads-commons-web",
    "ads-engine",
    "ads-egress-controlplane",
    "ads-guardrail",
    "ads-injection-scanner",
    "ads-policy",
    "ads-preferences",
    "ads-context-meter",
    "ads-context-compactor",
    "ads-context-runtime",
    "ads-sandbox-mcp",
    "ads-sandbox-ipc",
    "ads-sandbox-manager",
]

[tool.uv]
package = false
add-bounds = "exact"
constraint-dependencies = []
override-dependencies = []

[tool.uv.workspace]
members = [
    "libraries/ads-commons",
    "libraries/ads-commons-beans",
    "libraries/ads-commons-schema",
    "libraries/ads-commons-web",
    "services/ads",
    "services/ads-audit",
    "services/ads-engine",
    "services/ads-egress-controlplane",
    "services/ads-guardrail",
    "services/ads-injection-scanner",
    "services/ads-policy",
    "services/ads-preferences",
    "services/ads-context-meter",
    "services/ads-context-compactor",
    "libraries/ads-context-runtime",
    "services/ads-sandbox-mcp",
    "services/ads-sandbox-ipc",
    "services/ads-sandbox-manager",
]

[tool.uv.sources]
ads = { workspace = true }
ads-audit = { workspace = true }
ads-commons = { workspace = true }
ads-commons-beans = { workspace = true }
ads-commons-schema = { workspace = true }
ads-commons-web = { workspace = true }
ads-engine = { workspace = true }
ads-egress-controlplane = { workspace = true }
ads-guardrail = { workspace = true }
ads-injection-scanner = { workspace = true }
ads-policy = { workspace = true }
ads-preferences = { workspace = true }
ads-context-meter = { workspace = true }
ads-context-compactor = { workspace = true }
ads-context-runtime = { workspace = true }
ads-sandbox-mcp = { workspace = true }
ads-sandbox-ipc = { workspace = true }
ads-sandbox-manager = { workspace = true }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[dependency-groups]
lint = [
    "ruff==0.16.7",
]
deps = [
    "deptry==0.25.1",
]
typecheck = [
    "mypy==2.3.1",
]
test = [
    "playwright==1.59.0",
    "PyYAML==6.0.3",
    "fakeredis==2.38.0",
    "pytest==9.1.1",
    "testcontainers==4.15.0",
]
dev = [
    "nox==2026.8.17",
]

[tool.ruff]
src = [
    "libraries/ads-commons/src",
    "libraries/ads-commons/tests",
    "libraries/ads-commons-beans/src",
    "libraries/ads-commons-beans/tests",
    "libraries/ads-commons-schema/src",
    "libraries/ads-commons-schema/tests",
    "libraries/ads-commons-web/src",
    "services/ads/src",
    "services/ads/tests",
    "services/ads-audit/src",
    "services/ads-audit/tests",
    "services/ads-engine/src",
    "services/ads-engine/tests",
    "services/ads-egress-controlplane/src",
    "services/ads-guardrail/src",
    "services/ads-guardrail/tests",
    "services/ads-injection-scanner/src",
    "services/ads-injection-scanner/tests",
    "services/ads-policy/src",
    "services/ads-policy/tests",
    "services/ads-preferences/src",
    "services/ads-preferences/tests",
    "services/ads-context-meter/src",
    "services/ads-context-compactor/src",
    "libraries/ads-context-runtime/src",
    "services/ads-context-meter/tests",
    "services/ads-context-compactor/tests",
    "libraries/ads-context-runtime/tests",
    "services/ads-sandbox-mcp/src",
    "services/ads-sandbox-mcp/tests",
    "services/ads-sandbox-ipc/src",
    "services/ads-sandbox-ipc/tests",
    "services/ads-sandbox-manager/src",
    "services/ads-sandbox-manager/tests",
    "tests/chain",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "libraries/ads-commons/src:libraries/ads-commons-beans/src:libraries/ads-commons-schema/src:libraries/ads-commons-web/src:services/ads/src:services/ads-audit/src:services/ads-engine/src:services/ads-egress-controlplane/src:services/ads-guardrail/src:services/ads-injection-scanner/src:services/ads-policy/src:services/ads-preferences/src:services/ads-context-meter/src:services/ads-context-compactor/src:libraries/ads-context-runtime/src:services/ads-sandbox-mcp/src:services/ads-sandbox-ipc/src:services/ads-sandbox-manager/src"
packages = [
    "ads_commons",
    "ads_commons_beans",
    "ads_commons_schema",
    "ads_commons_web",
    "ads",
    "ads_audit",
    "ads_engine",
    "ads_egress_controlplane",
    "ads_guardrail",
    "ads_injection_scanner",
    "ads_policy",
    "ads_preferences",
    "ads_context_meter",
    "ads_context_compactor",
    "ads_context_runtime",
    "ads_sandbox_mcp",
    "ads_sandbox_ipc",
    "ads_sandbox_manager",
]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["advanced_alchemy", "advanced_alchemy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = [
    "libraries/ads-context-runtime/tests",
    "services/ads-sandbox-mcp/tests",
    "services/ads-sandbox-ipc/tests",
]
testpaths = [
    "deploy/tests",
    "deploy/keycloak/tests",
    "deploy/lab/sandbox-identity/tests",
    "libraries/ads-commons/tests",
    "libraries/ads-commons-beans/tests",
    "libraries/ads-commons-schema/tests",
    "services/ads/tests",
    "services/ads-audit/tests",
    "services/ads-engine/tests",
    "services/ads-guardrail/tests",
    "services/ads-injection-scanner/tests",
    "services/ads-policy/tests",
    "services/ads-preferences/tests",
    "services/ads-context-meter/tests",
    "services/ads-context-compactor/tests",
    "libraries/ads-context-runtime/tests",
    "services/ads-sandbox-mcp/tests",
    "services/ads-sandbox-ipc/tests",
    "services/ads-sandbox-manager/tests",
    "tests/chain",
]
addopts = "-q"
markers = [
  "integration: tests that start Keycloak, RabbitMQ or PostgreSQL via testcontainers",
]

[tool.deptry]
known_first_party = [
  "ads",
  "ads_audit",
  "ads_commons",
  "ads_commons_beans",
  "ads_commons_schema",
  "ads_commons_web",
  "ads_context_compactor",
  "ads_context_meter",
  "ads_context_runtime",
  "ads_egress_controlplane",
  "ads_engine",
  "ads_guardrail",
  "ads_injection_scanner",
  "ads_policy",
  "ads_preferences",
  "ads_sandbox_mcp",
  "ads_sandbox_ipc",
  "ads_sandbox_manager",
]
