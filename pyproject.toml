[project]
name = "ads-workspace"
version = "0.0.1"
description = "Autonomous Development System workspace"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads",
    "ads-audit",
    "ads-commons",
    "ads-engine",
    "ads-egress-controlplane",
    "ads-policy",
    "ads-supervisor",
]

[tool.uv]
package = false
add-bounds = "exact"
constraint-dependencies = []
override-dependencies = []
exclude-dependencies = []

[tool.uv.workspace]
members = [
    "libraries/ads-commons",
    "services/ads",
    "services/ads-audit",
    "services/ads-engine",
    "services/ads-egress-controlplane",
    "services/ads-policy",
    "services/ads-supervisor",
]

[tool.uv.sources]
ads = { workspace = true }
ads-audit = { workspace = true }
ads-commons = { workspace = true }
ads-engine = { workspace = true }
ads-egress-controlplane = { workspace = true }
ads-policy = { workspace = true }
ads-supervisor = { workspace = true }

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.interlab/repository/pypi-group/simple"
default = true

[dependency-groups]
lint = [
    "ruff==0.16.7",
]
deps = [
    "deptry==0.25.1",
]
typecheck = [
    "mypy==2.3.1",
]
test = [
    "fakeredis==2.38.0",
    "pytest==9.1.1",
    "testcontainers==4.15.0",
]
dev = [
    "nox==2026.8.17",
]

[tool.ruff]
src = [
    "libraries/ads-commons/src",
    "libraries/ads-commons/tests",
    "services/ads/src",
    "services/ads/tests",
    "services/ads-audit/src",
    "services/ads-audit/tests",
    "services/ads-engine/src",
    "services/ads-engine/tests",
    "services/ads-egress-controlplane/src",
    "services/ads-policy/src",
    "services/ads-policy/tests",
    "services/ads-supervisor/src",
    "services/ads-supervisor/tests",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "libraries/ads-commons/src:services/ads/src:services/ads-audit/src:services/ads-engine/src:services/ads-egress-controlplane/src:services/ads-policy/src:services/ads-supervisor/src"
packages = [
    "ads_commons",
    "ads",
    "ads_audit",
    "ads_engine",
    "ads_egress_controlplane",
    "ads_policy",
    "ads_supervisor",
]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = [
  "libraries/ads-commons/tests",
  "services/ads/tests",
  "services/ads-audit/tests",
  "services/ads-engine/tests",
  "services/ads-policy/tests",
  "services/ads-supervisor/tests",
]
addopts = "-q"
markers = [
  "integration: tests that start Keycloak, RabbitMQ or PostgreSQL via testcontainers",
]

[tool.deptry]
known_first_party = [
  "ads",
  "ads_audit",
  "ads_egress_controlplane",
  "ads_policy",
  "ads_supervisor",
  "ads_commons",
  "ads_engine",
]
