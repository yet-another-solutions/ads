[project]
name = "ads"
version = "0.0.1"
description = "Autonomous Development System"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "authlib==1.8.0",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "litestar[jinja]==2.24.0",
    "msgspec==0.21.1",
    "pyjwt[crypto]==2.14.0",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
    "wrapt==2.4.1",
]

[project.scripts]
ads = "ads.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.interlab/repository/pypi-group/simple"
default = true

[tool.uv]
add-bounds = "exact"
constraint-dependencies = []
override-dependencies = []
exclude-dependencies = []

[dependency-groups]
lint = [
    "ruff==0.16.7",
]
deps = [
    "deptry==0.25.1",
]
typecheck = [
    "mypy==2.3.1",
]
test = [
    "pytest==9.1.1",
    "testcontainers==4.15.0",
]
dev = [
    "nox==2026.8.17",
]

[tool.ruff]
src = ["src", "tests"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
packages = ["ads"]
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: tests that start Keycloak via testcontainers",
]

[tool.deptry]
known_first_party = ["ads"]
