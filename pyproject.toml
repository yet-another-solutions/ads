[project]
name = "ads-workspace"
version = "0.0.1"
description = "Autonomous Development System workspace"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads",
    "ads-egress-controlplane",
]

[tool.uv]
package = false
add-bounds = "exact"
constraint-dependencies = []
override-dependencies = []
exclude-dependencies = []

[tool.uv.workspace]
members = [
    "services/ads",
    "services/ads-egress-controlplane",
]

[tool.uv.sources]
ads = { workspace = true }
ads-egress-controlplane = { workspace = true }

[[tool.uv.index]]
name = "nexus"
url = "https://nexus.interlab/repository/pypi-group/simple"
default = true

[dependency-groups]
lint = [
    "ruff==0.16.7",
]
deps = [
    "deptry==0.25.1",
]
typecheck = [
    "mypy==2.3.1",
]
test = [
    "pytest==9.1.1",
    "testcontainers==4.15.0",
]
dev = [
    "nox==2026.8.17",
]

[tool.ruff]
src = [
    "services/ads/src",
    "services/ads/tests",
    "services/ads-egress-controlplane/src",
]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "services/ads/src:services/ads-egress-controlplane/src"
packages = ["ads", "ads_egress_controlplane"]
explicit_package_bases = true
strict = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["services/ads/tests"]
addopts = "-q"
markers = [
  "integration: tests that start Keycloak via testcontainers",
]

[tool.deptry]
known_first_party = ["ads", "ads_egress_controlplane"]
