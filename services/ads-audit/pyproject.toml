[project]
name = "ads-audit"
version = "0.0.1"
description = "ADS audit journal"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-policy==0.0.1",
    "aio-pika==10.0.1",
    "anyio==4.12.0",
    "asyncpg==0.31.0",
    "dishka==1.10.1",
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "sqlalchemy[asyncio]==2.0.52",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-audit = "ads_audit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_audit"]

[tool.deptry]
known_first_party = ["ads_audit"]

# asyncpg is the driver SQLAlchemy dials through the URL, so nothing imports it.
[tool.deptry.per_rule_ignores]
DEP002 = ["asyncpg"]
