[project]
name = "ads-context-meter"
version = "0.0.1"
description = "Offline, model-specific ADS context token estimation"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "dishka==1.10.1",
    "litellm==1.101.0",
    "litestar==2.24.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-context-meter = "ads_context_meter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_context_meter"]

[tool.deptry]
known_first_party = ["ads_context_meter"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
