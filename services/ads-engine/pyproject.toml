[project]
name = "ads-engine"
version = "0.0.1"
description = "ADS Kafka model orchestration"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "ads-commons-schema",
    "aiohttp==3.14.3",
    "aiokafka==0.14.0",
    "anyio==4.15.1",
    "alembic==1.16.5",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "langchain-core==1.6.3",
    "langchain-openai==1.6.2",
    "langsmith==0.12.4",
    "mcp==2.2.0",
    "msgspec==0.21.1",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.43",
    "structlog==26.1.0",
]

[project.scripts]
ads-engine = "ads_engine.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_engine"]

[tool.deptry]
known_first_party = ["ads_engine"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
ads-commons-schema = ["ads_commons_schema"]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]
