[project]
name = "ads-guardrail"
version = "0.0.1"
description = "ADS guardrail: the policy enforcement point in front of the agents"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "ads-policy==0.0.1",
    "aio-pika==10.0.1",
    "aiohttp==3.14.3",
    "anyio==4.12.0",
    "dishka==1.10.1",
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "pyjwt[crypto]==2.14.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-guardrail = "ads_guardrail.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_guardrail"]

[tool.deptry]
known_first_party = ["ads_guardrail"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
