[project]
name = "ads-injection-scanner"
version = "0.0.1"
description = "ADS injection scanner: prompt-injection classifier for tool results"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "anyio==4.12.0",
    "litestar==2.24.0",
    "numpy==2.5.3",
    "onnxruntime==1.30.0",
    "structlog==26.1.0",
    "tokenizers==0.23.2",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-injection-scanner = "ads_injection_scanner.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_injection_scanner"]

[tool.deptry]
known_first_party = ["ads_injection_scanner"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
