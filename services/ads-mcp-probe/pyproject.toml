[project]
name = "ads-mcp-probe"
version = "0.0.1"
description = "ADS MCP probe: a harmless MCP server whose tools trip every guardrail check"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-mcp-probe = "ads_mcp_probe.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_mcp_probe"]

[tool.deptry]
known_first_party = ["ads_mcp_probe"]
