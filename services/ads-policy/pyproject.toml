[project]
name = "ads-policy"
version = "0.0.1"
description = "ADS policy decision point"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "aio-pika==10.0.1",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "redis==8.1.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-policy = "ads_policy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_policy"]

[tool.deptry]
known_first_party = ["ads_policy"]
