[project]
name = "ads-preferences"
version = "0.0.1"
description = "ADS user model catalog"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "advanced-alchemy==1.8.1",
    "alembic==1.16.5",
    "dishka==1.10.1",
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "pyjwt[crypto]==2.14.0",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.43",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-preferences = "ads_preferences.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_preferences"]

[tool.deptry]
known_first_party = ["ads_preferences"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
advanced-alchemy = ["advanced_alchemy"]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]
