[project]
name = "ads-sandbox-ca"
version = "0.0.1"
description = "One-time ADS egress CA paired-volume initialization"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = ["cryptography==50.0.1"]

[project.scripts]
ads-sandbox-ca = "ads_sandbox_ca.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_sandbox_ca"]

[tool.deptry]
known_first_party = ["ads_sandbox_ca"]
