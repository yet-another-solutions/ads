[project]
name = "ads-sandbox-egress"
version = "0.0.1"
description = "ADS paired sandbox egress enforcement"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "cffi==2.1.1",
    "cryptography==50.0.1",
    "dishka==1.10.1",
    "dnspython==2.8.0",
    "h11==0.16.0",
    "litestar==2.24.0",
    "msgspec==0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_sandbox_egress"]

[tool.deptry]
known_first_party = ["ads_sandbox_egress"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
