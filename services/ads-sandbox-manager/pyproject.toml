[project]
name = "ads-sandbox-manager"
version = "0.0.1"
description = "ADS sandbox lifecycle manager"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "ads-commons-schema",
    "aiokafka==0.14.0",
    "alembic==1.16.5",
    "cryptography==50.0.1",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "kubernetes==36.0.3",
    "litestar==2.24.0",
    "msgspec==0.21.1",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.43",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-sandbox-manager = "ads_sandbox_manager.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_sandbox_manager"]

[tool.deptry]
known_first_party = ["ads_sandbox_manager"]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
ads-commons-schema = ["ads_commons_schema"]
