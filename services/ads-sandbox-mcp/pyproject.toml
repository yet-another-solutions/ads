[project]
name = "ads-sandbox-mcp"
version = "0.0.1"
description = "ADS authenticated sandbox MCP tool server"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "ads-commons-schema",
    "aiokafka==0.14.0",
    "alembic==1.16.5",
    "anyio==4.15.1",
    "dishka==1.10.1",
    "litestar==2.24.0",
    "mcp==2.2.0",
    "msgspec==0.21.1",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.43",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
]

[project.scripts]
ads-sandbox-mcp = "ads_sandbox_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads_sandbox_mcp"]

[tool.deptry]
known_first_party = ["ads_sandbox_mcp"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
ads-commons-schema = ["ads_commons_schema"]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]
