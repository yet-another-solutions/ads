[project]
name = "ads"
version = "0.0.1"
description = "Autonomous Development System"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "authlib==1.8.0",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "litestar[jinja]==2.24.0",
    "msgspec==0.21.1",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
    "wrapt==2.4.1",
]

[project.scripts]
ads = "ads.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.deptry]
known_first_party = ["ads"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
