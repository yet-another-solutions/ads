[project]
name = "ads"
version = "0.0.1"
description = "Autonomous Development System"
requires-python = ">=3.12"
authors = [{ name = "yet-another-solutions" }]
dependencies = [
    "ads-commons",
    "ads-commons-beans",
    "ads-commons-schema",
    "ads-policy==0.0.1",
    "advanced-alchemy==1.8.1",
    "aio-pika==10.0.1",
    "aiokafka==0.14.0",
    "alembic==1.16.5",
    "authlib==1.8.0",
    "dishka==1.10.1",
    "httpx2==2.12.0",
    "litestar[jinja]==2.24.0",
    "msgspec==0.21.1",
    "psycopg[binary]==3.2.12",
    "sqlalchemy==2.0.43",
    "stamina==26.1.0",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.4",
    "wrapt==2.4.1",
]

[project.scripts]
ads = "ads.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ads"]

[tool.deptry]
known_first_party = ["ads"]

[tool.deptry.package_module_name_map]
ads-commons = ["ads_commons"]
ads-commons-beans = ["ads_commons_beans"]
ads-commons-schema = ["ads_commons_schema"]
ads-policy = ["ads_policy"]
advanced-alchemy = ["advanced_alchemy"]

[tool.deptry.per_rule_ignores]
DEP002 = ["alembic", "psycopg"]
